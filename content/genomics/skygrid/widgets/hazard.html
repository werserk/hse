<!doctype html><meta charset="utf-8">
<style>
.w{font-family:var(--font-sans)}
svg text{font:11px var(--font-mono);fill:var(--muted-foreground)}
svg .ax{stroke:var(--border);fill:none}svg .ln{fill:none;stroke-width:2}
.l{font-size:12px;color:var(--muted-foreground);margin-top:4px}
</style>
<div class="w"><svg id="s" viewBox="0 0 640 326" width="100%"></svg></div>
<script>
const Ne=t=>t<1?1:t<2.5?3:.5, lam=t=>1/Ne(t), T=4, N=800, dt=T/N;
const S=[],p=[];let cum=0;
for(let i=0;i<=N;i++){const t=i*dt;if(i>0)cum+=lam(t-dt/2)*dt;S.push(Math.exp(-cum));}
const X=t=>50+t/T*570;
const panels=[{name:'N_e(t)',y0:10,h:80,f:Ne,max:3.3,c:'var(--chart-1)',step:1},
 {name:'λ(t) = 1/N_e(t)',y0:115,h:80,f:lam,max:2.2,c:'var(--chart-2)',step:1},
 {name:'вероятность дожить без слияния',y0:220,h:80,f:t=>S[Math.round(t/dt)],max:1.05,c:'var(--brand)'}];
let s='';
panels.forEach(P=>{const Y=v=>P.y0+P.h-v/P.max*P.h;
 s+=`<path class="ax" d="M50 ${P.y0}V${P.y0+P.h}H620"/><text x="${P.name[0]=='в'?250:54}" y="${P.y0+9}">${P.name}</text>`;
 let d='';for(let i=0;i<=N;i++){const t=i*dt;d+=(i?'L':'M')+X(t).toFixed(1)+' '+Y(P.f(Math.min(t,T-1e-9))).toFixed(1)}
 s+=`<path class="ln" stroke="${P.c}" d="${d}"/>`});
[1,2.5].forEach(t=>s+=`<line x1="${X(t)}" x2="${X(t)}" y1="10" y2="300" stroke="var(--border)" stroke-dasharray="3 3"/>`);
for(let a=0;a<=4;a++)s+=`<text x="${X(a)}" y="318" text-anchor="middle">${a}</text>`;
s+=`<text x="640" y="318" text-anchor="end">t</text>`;
[[1,10,80,3.3],[0.5,10,80,3.3]].forEach(()=>0);
const yl=(P,v,txt)=>`<text x="44" y="${P.y0+P.h-v/P.max*P.h+4}" text-anchor="end">${txt}</text>`;
panels.forEach((P,i)=>{(i==0?[[.5,'0.5'],[1,'1'],[3,'3']]:i==1?[[.33,'⅓'],[1,'1'],[2,'2']]:[[0,'0'],[1,'1']]).forEach(([v,t])=>s+=yl(P,v,t))});
document.getElementById('s').innerHTML=s;
</script>
