<!doctype html><meta charset="utf-8">
<style>
.w{font-family:var(--font-sans);display:grid;grid-template-columns:1fr 1fr;gap:20px}
.p{border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;background:var(--card)}
.p h4{margin:0 0 6px;font-size:14px}
svg text{font:11px var(--font-mono);fill:var(--muted-foreground)}svg .n{fill:var(--foreground)}
.l{grid-column:1/3;font-size:12px;color:var(--muted-foreground)}
</style>
<div class="w" id="w"></div>
<script>
// n = 30 tips, constant Ne = 1, grid K = 3, M = 6 (cells of width 0.5); fixed seed
let a=20261119;const rnd=()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const n=30,M=6,K=3;function locus(){let t=0;const ev=[];for(let k=n;k>=2;k--){t+=-Math.log(1-rnd())/(k*(k-1)/2);ev.push(t)}return ev}
const L=[...Array(10)].map(locus),cnt=ls=>{const c=Array(M).fill(0);ls.forEach(ev=>ev.forEach(t=>{const i=Math.floor(t/(K/M));if(i<M)c[i]++}));return c};
function panel(ls,title,mx){const c=cnt(ls);
 let s=`<svg viewBox="0 0 300 190" width="100%">`;
 c.forEach((v,i)=>{const x=14+i*46,h=v?Math.max(3,Math.log10(1+v)/Math.log10(1+mx)*130):0;
  s+=`<rect x="${x}" y="${150-h}" width="34" height="${h}" fill="${v<3?'var(--destructive)':'var(--chart-1)'}" opacity=".85"/><text class="n" x="${x+17}" y="${144-h}" text-anchor="middle">${v}</text><text x="${x+17}" y="166" text-anchor="middle">${i+1}</text>`});
 s+=`<line x1="10" x2="292" y1="150" y2="150" stroke="var(--border)"/><text x="150" y="184" text-anchor="middle">ячейка сетки k (ширина 0.5)</text></svg>`;
 return `<div class="p"><h4>${title}</h4>${s}</div>`}
const mx=cnt(L).reduce((p,c)=>Math.max(p,c),0);
document.getElementById('w').innerHTML=panel([L[0]],'1 локус: c<sub>k</sub>',mx)+panel(L,'10 локусов: c<sub>k</sub> = Σ c<sub>ik</sub>',mx);
</script>
