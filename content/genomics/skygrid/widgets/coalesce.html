<!doctype html><meta charset="utf-8">
<style>
.w{font-family:var(--font-sans);display:grid;grid-template-columns:1fr 1fr;gap:20px}
.p{border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;background:var(--card)}
.p h4{margin:0 0 2px;font-size:14px}.p .s{font-size:12px;color:var(--muted-foreground);margin-bottom:6px}
svg text{font:11px var(--font-mono);fill:var(--muted-foreground)}
svg .ax{stroke:var(--border)}svg .br{stroke:var(--foreground);fill:none;stroke-width:1.6}
svg .ev{fill:var(--brand)}
table{border-collapse:collapse;font:12px var(--font-mono);margin-top:6px;width:100%}
td,th{padding:2px 6px;text-align:right;color:var(--muted-foreground);font-weight:400}th{color:var(--foreground);font-weight:600}
.v{margin-top:6px;font-size:12px;color:var(--muted-foreground)}
</style>
<div class="w" id="w"></div>
<script>
// expected waiting times E[w_k] = 2 Ne / (k(k-1)); both trees on one time scale
const n=6,T=5.3,H=250,W=300,L=34;
const merges=[[0,1],[2,3],[4,5],[0,2],[0,4]]; // clusters named by a member tip, k = 6,5,4,3,2
function panel(Ne,color){
  const ks=[6,5,4,3,2],tm=[];let t=0;
  ks.forEach(k=>{t+=2*Ne/(k*(k-1));tm.push(t)});
  const X=t=>L+t/T*(W-L-8),Y=i=>14+i*(H-30)/(n-1);
  const y=[...Array(n)].map((_,i)=>Y(i)),cl={};for(let i=0;i<n;i++)cl[i]={y:y[i],t:0};
  let s=`<svg viewBox="0 0 ${W} ${H+14}" width="100%"><line class="ax" x1="${L}" x2="${W-6}" y1="${H-8}" y2="${H-8}"/>`;
  for(let a=0;a<=5;a++)s+=`<line class="ax" x1="${X(a)}" x2="${X(a)}" y1="${H-11}" y2="${H-5}"/><text x="${X(a)}" y="${H+4}" text-anchor="middle">${a}</text>`;
  merges.forEach(([a,b],j)=>{const A=cl[a],B=cl[b],tt=tm[j],yy=(A.y+B.y)/2;
    s+=`<path class="br" d="M${X(A.t)} ${A.y}H${X(tt)}V${B.y}H${X(B.t)}"/><circle class="ev" cx="${X(tt)}" cy="${yy}" r="3.5"/>`;
    cl[a]={y:yy,t:tt}});
  s+=`</svg>`;
  let rows=ks.map((k,j)=>`<tr><td>${k}</td><td>${k*(k-1)/2}</td><td>${(k*(k-1)/2/Ne).toFixed(2)}</td><td>${(2*Ne/(k*(k-1))).toFixed(2)}</td><td>${tm[j].toFixed(2)}</td></tr>`).join('');
  return `<div class="p"><h4>N<sub>e</sub> = ${Ne}</h4><div class="s">корень на t = ${t.toFixed(2)}</div>${s}
  <table><tr><th>k</th><th>пар</th><th>λ<sub>k</sub></th><th>E w<sub>k</sub></th><th>t</th></tr>${rows}</table></div>`;
}
document.getElementById('w').innerHTML=panel(1)+panel(3);
</script>
