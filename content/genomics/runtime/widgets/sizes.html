<!-- Fig. 1.1: input sizes of the Schubert 2020 scaling run, drawn to scale (heights ∝ haplotypes). -->
<style>
.w{font-family:var(--font-sans);display:grid;grid-template-columns:auto 1fr;column-gap:28px;align-items:start}
svg{display:block;overflow:visible}
svg text{font-family:var(--font-sans);font-size:12px;fill:var(--muted-foreground)}
svg .t{font-size:14px;font-weight:600;fill:var(--foreground)}
svg .m{font-family:var(--font-mono);font-size:12px}
svg .ix{font-size:10px;fill:var(--subtle-foreground)}
.side{border-left:2px solid var(--border);padding-left:14px;font-size:13px;line-height:1.55;color:var(--muted-foreground)}
.side b{color:var(--foreground);font-weight:600}
.side p{margin:0 0 10px}
.side p:last-child{margin:0}
</style>
<div class="w"><div id="fig"></div><div class="side" id="side"></div></div>
<script>
// constants of the run (see notes.md, «Размер задачи»): p assumed, panel estimated
const p=50000, ceu=89, yri=97, n2=2*(ceu+yri), Nmax=2000, ticks=[500,1000,1500];
const W=280, L=70, X0=L, X1=L+W, k=200/(2*Nmax);          // px per haplotype
const yP=40, hC=2*ceu*k, hY=2*yri*k, yC=yP+hC+hY+46, hN=2*Nmax*k;
const fmt=x=>x.toLocaleString('ru-RU');
const mb=b=>(b/8/1e6);
const sci=x=>{const e=Math.floor(Math.log10(x)),m=Math.round(x/10**e);return `${m}·10${String(e).replace(/./g,d=>'⁰¹²³⁴⁵⁶⁷⁸⁹'[d])}`};
let s=`<svg width="${X1+120}" height="${yC+hN+34}">`;
// width bracket: p SNPs
s+=`<path d="M${X0} 22 v-6 H${X1} v6" fill="none" stroke="var(--border)"/>`;
s+=`<text x="${(X0+X1)/2}" y="10" text-anchor="middle">p = ${fmt(p)} SNP</text>`;
// panel: two bands by population
s+=`<text class="t" x="${L-10}" y="${yP+hC+hY/2+5}" text-anchor="end">панель</text>`;
s+=`<rect x="${X0}" y="${yP}" width="${W}" height="${hC}" fill="color-mix(in srgb,var(--foreground) 30%,transparent)"/>`;
s+=`<rect x="${X0}" y="${yP+hC}" width="${W}" height="${hY}" fill="color-mix(in srgb,var(--foreground) 16%,transparent)"/>`;
s+=`<text class="m" x="${X1+8}" y="${yP+hC/2+4}">CEU ${2*ceu}</text><text class="m" x="${X1+8}" y="${yP+hC+hY/2+6}">YRI ${2*yri}</text>`;
s+=`<text class="ix" x="${X0}" y="${yP+hC+hY+14}">2n ≈ ${n2} гаплотипа</text>`;
// cohort with the N levels of the run
s+=`<text class="t" x="${L-10}" y="${yC+hN/2+5}" text-anchor="end">когорта</text>`;
s+=`<rect x="${X0}" y="${yC}" width="${W}" height="${hN}" fill="color-mix(in srgb,var(--brand) 18%,transparent)" stroke="color-mix(in srgb,var(--brand) 60%,transparent)"/>`;
for(const N of ticks){const y=yC+2*N*k;s+=`<line x1="${X0}" x2="${X1}" y1="${y}" y2="${y}" stroke="var(--brand)" stroke-dasharray="4 4" opacity=".6"/><text class="m" x="${X1+8}" y="${y+4}">N = ${N}</text>`}
s+=`<text class="m" x="${X1+8}" y="${yC+hN+4}">N = ${Nmax}</text>`;
s+=`<text class="ix" x="${X0}" y="${yC+hN+16}">2N = ${fmt(2*Nmax)} гаплотипов</text>`;
s+='</svg>';
document.getElementById('fig').innerHTML=s;
document.getElementById('side').innerHTML=
 `<p><b>Строка</b> — гаплотип, <b>столбец</b> — SNP, клетка — аллель 0 или 1. Высоты в масштабе.</p>`+
 `<p><b>Панель</b> одна на все запуски: ${n2} гаплотипа, ${mb(n2*p).toFixed(1).replace('.',',')} МБ при одном бите на аллель.</p>`+
 `<p><b>Когорта</b> растёт от запуска к запуску, пунктир — её граница при меньших N. При N = ${Nmax} это ${sci(2*Nmax*p)} аллелей, ${Math.round(mb(2*Nmax*p))} МБ, в ${(2*Nmax/n2).toFixed(1).replace('.',',')} раза больше панели.</p>`+
 `<p><b>Ответ</b> — метка популяции для каждой клетки когорты, тоже ${fmt(2*Nmax)} × ${fmt(p)}.</p>`;
</script>
