<!-- Fig. 1.1: LAI input and output on the LOTER konspekt toy panel; cohort haplotypes are built from copying paths. -->
<style>
.w{font-family:var(--font-sans);display:grid;grid-template-columns:auto 1fr;column-gap:28px;align-items:start}
.blk{margin:0 0 14px}
.ttl{font-size:14px;font-weight:600;color:var(--foreground);margin:0 0 6px 34px}
.two{display:flex;gap:18px;align-items:flex-start}
.r{display:flex;align-items:center;gap:8px;margin:2px 0}
.l{width:26px;text-align:right;font:12px var(--font-mono);color:var(--muted-foreground)}
.s{display:flex;gap:2px;font-family:var(--font-mono);font-size:12px}
.s span{box-sizing:border-box;width:20px;height:20px;display:flex;align-items:center;justify-content:center;border-radius:3px}
.idx span{height:13px;font-size:10px;color:var(--subtle-foreground)}
.pA span{background:color-mix(in srgb,var(--foreground) 26%,transparent)}
.pB span{background:color-mix(in srgb,var(--foreground) 9%,transparent)}
.h span{background:var(--muted);color:var(--foreground)}
.a span.A{background:color-mix(in srgb,var(--foreground) 70%,transparent);color:var(--background);font-weight:600}
.a span.B{background:color-mix(in srgb,var(--foreground) 14%,transparent);color:var(--foreground);font-weight:600}
.gap{height:7px}
.arr{align-self:center;font-size:20px;color:var(--muted-foreground);padding-top:18px}
.side{border-left:2px solid var(--border);padding-left:14px;font-size:13px;line-height:1.55;color:var(--muted-foreground)}
.side b{color:var(--foreground);font-weight:600}
.side p{margin:0 0 10px}
.side p:last-child{margin:0}
</style>
<div class="w"><div id="fig"></div><div class="side" id="side"></div></div>
<script>
// panel and the first target are the LOTER konspekt running example (ch. 1–3)
const H={A1:'0010001000',A2:'0100000010',B1:'1111101111',B2:'1011111101'},P=10;
// each cohort haplotype is copied from panel pieces; its true ancestry is the population of the copied reference
const run=(...seg)=>seg.flatMap(([r,len])=>Array(len).fill(r));
const paths=[run(['A1',2],['B1',5],['A2',3]), run(['B2',10]),
             run(['A2',6],['B2',4]),          run(['B1',3],['A1',7]),
             run(['A1',10]),                  run(['B2',4],['A2',3],['B1',3])];
const coh=paths.map(s=>s.map((r,j)=>H[r][j]).join(''));
const anc=paths.map(s=>s.map(r=>r[0]));
const N=paths.length/2, n2=Object.keys(H).length;
const cells=(f)=>Array.from({length:P},(_,j)=>f(j)).join('');
const row=(lab,cls,f)=>`<div class="r"><div class="l">${lab}</div><div class="s ${cls}">${cells(f)}</div></div>`;
const idx=row('','idx',j=>`<span>${j+1}</span>`);
const lab=i=>`${(i>>1)+1}${'ab'[i&1]}`;   // person 1..N, copy a/b
let panel=`<div class="blk"><div class="ttl">Панель H</div>${idx}`+
 Object.entries(H).map(([k,v])=>row(k,'p'+k[0],j=>`<span>${v[j]}</span>`)).join('')+`</div>`;
let cohort=`<div><div class="ttl">Когорта</div>${idx}`+
 coh.map((h,i)=>(i&&!(i&1)?'<div class="gap"></div>':'')+row(lab(i),'h',j=>`<span>${h[j]}</span>`)).join('')+`</div>`;
let answer=`<div><div class="ttl">Ответ a</div>${idx}`+
 anc.map((a,i)=>(i&&!(i&1)?'<div class="gap"></div>':'')+row(lab(i),'a',j=>`<span class="${a[j]}">${a[j]}</span>`)).join('')+`</div>`;
document.getElementById('fig').innerHTML=panel+`<div class="two">${cohort}<div class="arr">→</div>${answer}</div>`;
document.getElementById('side').innerHTML=
 `<p><b>Панель</b>: ${n2} гаплотипа известного происхождения (A1, A2 из популяции A; B1, B2 из B) на ${P} SNP, таблица 2n × p.</p>`+
 `<p><b>Когорта</b>: ${N} человека, у каждого две копии (a, b), всего ${2*N} гаплотипов, таблица 2N × p. Гаплотип 1a — цель h из конспекта Loter.</p>`+
 `<p><b>Ответ</b>: метка A или B на каждый SNP каждого гаплотипа когорты, таблица того же размера 2N × p.</p>`;
</script>
