<!-- Fig. 1.1 (stepper): LAI input and output on a toy cohort; the program labels one haplotype at a time.
     Cohort haplotypes are built from copying paths over the toy panel; counters are computed from the state. -->
<style>
.w{font-family:var(--font-sans)}
.top{display:flex;align-items:center;gap:6px;margin:0 0 14px}
.top button{font:13px var(--font-sans);height:28px;padding:0 10px;border:1px solid var(--border);border-radius:var(--radius);background:var(--card);color:var(--foreground);cursor:pointer}
.top button:disabled{opacity:.35;cursor:default}
.top span{font-size:12px;color:var(--muted-foreground);margin-left:6px}
.g{display:grid;grid-template-columns:270px 1fr;column-gap:28px;align-items:start}
.ttl{font-size:13px;font-weight:600;color:var(--foreground);margin:10px 0 4px 34px}
.ttl:first-child{margin-top:0}
.r{display:flex;align-items:center;gap:8px;margin:2px 0}
.l{width:26px;text-align:right;font:12px var(--font-mono);color:var(--muted-foreground)}
.s{display:flex;gap:2px;font-family:var(--font-mono);font-size:12px;border-radius:4px;outline:2px solid transparent;outline-offset:1px;transition:outline-color .2s}
.s span{box-sizing:border-box;width:20px;height:20px;display:flex;align-items:center;justify-content:center;border-radius:3px}
.idx span{height:13px;font-size:10px;color:var(--subtle-foreground)}
.pA span{background:color-mix(in srgb,var(--foreground) 26%,transparent)}
.pB span{background:color-mix(in srgb,var(--foreground) 9%,transparent)}
.h span{background:var(--muted);color:var(--foreground)}
.a span:empty{border:1px dashed var(--border)}
.a span.A{background:color-mix(in srgb,var(--foreground) 70%,transparent);color:var(--background);font-weight:600}
.a span.B{background:color-mix(in srgb,var(--foreground) 14%,transparent);color:var(--foreground);font-weight:600}
.s.mem{outline-color:var(--brand)}
.s span.cur{outline:2px solid var(--foreground);outline-offset:-2px}
.gap{height:6px}
.col{display:flex;flex-direction:column;gap:2px}
.col .l{height:20px;line-height:20px}
.cnt{margin:12px 0 0 34px;font-size:12px;line-height:1.6;color:var(--muted-foreground)}
.cnt b{color:var(--foreground);font-weight:600}
.sw{display:inline-block;width:12px;height:10px;border-radius:2px;outline:2px solid var(--brand);outline-offset:-2px;vertical-align:-1px;margin-right:4px}
.txt{padding:9px 6px 9px 0;border-top:1px solid var(--border);font-size:13px;line-height:1.5;color:var(--subtle-foreground);cursor:pointer;display:grid;grid-template-columns:22px 1fr;gap:8px}
.txt:first-child{border-top:0;padding-top:0}
.txt .n{width:20px;height:20px;border-radius:50%;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px}
.txt b{display:block;color:inherit}
.txt .d{display:none}
.txt.done{color:var(--muted-foreground)}
.txt.on{color:var(--foreground)}
.txt.on .d{display:block}
.txt.on .n{background:var(--brand);border-color:var(--brand);color:var(--background)}
.txt.on b{color:var(--brand)}
</style>
<div class="w">
<div class="top"><button id="prev">◀ назад</button><button id="next">дальше ▶</button><span id="cnt"></span></div>
<div class="g"><div id="fig"></div><div id="steps"></div></div>
</div>
<script>
const H={A1:'0010001000',A2:'0100000010',B1:'1111101111',B2:'1011111101'},P=10;
// each cohort haplotype is copied from panel pieces; its true ancestry is the population of the copied reference
const run=(...seg)=>seg.flatMap(([r,len])=>Array(len).fill(r));
const paths=[run(['A1',2],['B1',5],['A2',3]), run(['B2',10]),
             run(['A2',6],['B2',4]),          run(['B1',3],['A1',7]),
             run(['A1',10]),                  run(['B2',4],['A2',3],['B1',3])];
const coh=paths.map(s=>s.map((r,j)=>H[r][j]).join(''));
const anc=paths.map(s=>s.map(r=>r[0]));
const n2=Object.keys(H).length, T=coh.length;             // 2n panel haplotypes, 2N cohort haplotypes
const lab=i=>`${(i>>1)+1}${'ab'[i&1]}`;                   // person 1..N, copy a/b
// panel: panel is read; fill: answer cells written (row-major); ms: per-cell speed when entering the step forward
const S=[
 {t:'Вход',panel:0,fill:0,d:`Панель: ${n2} гаплотипа известного происхождения, A1 и A2 из популяции A, B1 и B2 из B. Когорта: ${T/2} человека по два гаплотипа (a и b), происхождение неизвестно. Ответ пока пуст.`},
 {t:'Читаем панель',panel:1,fill:0,d:'Панель нужна для каждого гаплотипа когорты, поэтому программа читает её в память один раз.'},
 {t:'Гаплотип 1a',panel:1,fill:P,ms:220,d:'Программа читает 1a и пишет его ответ: метку A или B на каждом SNP. Для этого нужны только 1a и панель.'},
 {t:'Гаплотип 1b',panel:1,fill:2*P,ms:220,d:'Ответ 1a записан на диск и больше не нужен. На его место читается 1b. Объём памяти не изменился.'},
 {t:'Остальные гаплотипы',panel:1,fill:T*P,ms:45,d:'Так же по одному размечаются остальные гаплотипы. Каждый прочитан один раз, каждая метка записана один раз.'}];
let k=0,fill=0,cur=-1,timer=null;window.stepperBusy=false;
const $=id=>document.getElementById(id);
const cells=f=>Array.from({length:P},(_,j)=>f(j)).join('');
const row=(l,cls,f)=>`<div class="r"><div class="l">${l}</div><div class="s ${cls}">${cells(f)}</div></div>`;
function fig(){
 const s=S[k], act=cur>=0?Math.floor(cur/P):fill>0?Math.floor((fill-1)/P):-1;   // haplotype in memory
 const rowsRead=act+1, mem=(s.panel?n2*P:0)+(act>=0?2*P:0);
 const idx=row('','idx',j=>`<span>${j+1}</span>`);
 const gap=i=>i&&!(i&1)?'<div class="gap"></div>':'';
 return `<div class="ttl">Панель H</div>${idx}`+
  `<div class="r" style="align-items:flex-start"><div class="col">${Object.keys(H).map(kk=>`<div class="l">${kk}</div>`).join('')}</div>`+
  `<div class="s col${s.panel?' mem':''}">${Object.entries(H).map(([kk,v])=>`<div class="s p${kk[0]}">${cells(j=>`<span>${v[j]}</span>`)}</div>`).join('')}</div></div>`+
  `<div class="ttl">Когорта</div>${idx}`+
  coh.map((h,i)=>gap(i)+row(lab(i),'h'+(i==act?' mem':''),j=>`<span>${h[j]}</span>`)).join('')+
  `<div class="ttl">Ответ a</div>${idx}`+
  anc.map((a,i)=>gap(i)+row(lab(i),'a'+(i==act?' mem':''),j=>{const c=i*P+j;return c<fill?`<span class="${a[j]}${c==cur?' cur':''}">${a[j]}</span>`:'<span></span>'})).join('')+
  `<div class="cnt"><span class="sw"></span>в памяти: <b>${mem} бит</b><br>прочитано: <b>${(s.panel?n2*P:0)+rowsRead*P}</b> аллелей<br>записано: <b>${fill}</b> меток</div>`;
}
function draw(){
 $('fig').innerHTML=fig();
 $('steps').innerHTML=S.map((s,i)=>`<div class="txt ${i==k?'on':i<k?'done':''}" data-i="${i}"><span class="n">${i+1}</span><span><b>${s.t}</b><span class="d">${s.d}</span></span></div>`).join('');
 $('prev').disabled=k==0;$('next').disabled=k==S.length-1;$('cnt').textContent=`шаг ${k+1} из ${S.length}`;
}
function go(i){
 clearInterval(timer);window.stepperBusy=false;cur=-1;i=Math.max(0,Math.min(S.length-1,i));
 const fwd=i==k+1,s=S[i];k=i;
 if(fwd&&s.ms&&s.fill>fill){ // animate only one step forward; end in the full static state
  window.stepperBusy=true;
  const t=timer=setInterval(()=>{cur=fill;fill++;draw();if(fill>=s.fill){clearInterval(t);setTimeout(()=>{if(timer===t){cur=-1;draw();window.stepperBusy=false}},s.ms)}},s.ms);
  draw();return;
 }
 fill=s.fill;draw();
}
$('prev').onclick=()=>go(k-1);$('next').onclick=()=>go(k+1);
document.addEventListener('click',e=>{const t=e.target.closest('[data-i]');if(t)go(+t.dataset.i)});
// reserve the tallest step-list height, so the frame does not resize between steps
let hmax=0;for(k=0;k<S.length;k++){draw();hmax=Math.max(hmax,$('steps').offsetHeight)}
k=0;$('steps').style.minHeight=hmax+'px';draw();
</script>
