<!-- Fig. 5.2 (static): Amdahl's law S(c) = 1 / ((1 - f) + f / c) for three parallel fractions f.
     f = 0.5 is the estimate for Loter (C++ DP parallel via OpenMP over cohort haplotypes, graph.cpp:121-123;
     Python relabel pass sequential, assumed to take about half the time); the paper ran Loter on one core (-n 1). -->
<style>
.w{font-family:var(--font-sans);display:grid;grid-template-columns:auto 1fr;column-gap:26px;align-items:start}
svg{display:block;overflow:visible}
svg text{font-family:var(--font-sans);font-size:11px;fill:var(--muted-foreground)}
svg .grid{stroke:var(--border)}
svg .cl{font-size:11.5px;font-weight:600}
.side{border-left:2px solid var(--border);padding-left:14px;font-size:13px;line-height:1.55;color:var(--muted-foreground)}
.side b{color:var(--foreground);font-weight:600}
.side p{margin:0 0 10px}
.side p:last-child{margin:0}
</style>
<div class="w"><div id="fig"></div><div class="side" id="side"></div></div>
<script>
const S=(f,c)=>1/((1-f)+f/c);
const F=[[0.99,'var(--foreground)'],[0.9,'color-mix(in srgb,var(--foreground) 55%,transparent)'],[0.5,'var(--chart-2)']];
const CM=32,SM=32,L=34,T=10,W=330,H=200;
const X=c=>L+(c-1)/(CM-1)*W, Y=v=>T+H-(v-1)/(SM-1)*H;
const dec=v=>(Math.round(v*10)/10).toString().replace('.',',');
let s=`<svg width="${L+W+110}" height="${T+H+34}">`;
for(const v of [1,8,16,24,32])s+=`<line class="grid" x1="${L}" x2="${L+W}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end">${v}×</text>`;
for(const c of [1,8,16,24,32])s+=`<text x="${X(c)}" y="${T+H+15}" text-anchor="middle">${c}</text>`;
s+=`<text x="${L+W}" y="${T+H+30}" text-anchor="end">ядер c</text>`;
s+=`<line x1="${X(1)}" y1="${Y(1)}" x2="${X(SM)}" y2="${Y(SM)}" stroke="var(--muted-foreground)" stroke-dasharray="2 3"/><text x="${X(SM)+4}" y="${Y(SM)+4}">c×</text>`;
for(const [f,col] of F){let d='';for(let c=1;c<=CM;c++)d+=(c>1?'L':'M')+X(c).toFixed(1)+' '+Y(S(f,c)).toFixed(1);
 s+=`<path d="${d}" fill="none" stroke="${col}" stroke-width="2"/>`+
  `<text class="cl" x="${L+W+6}" y="${Y(S(f,CM))+4}" style="fill:${col}">f = ${String(f).replace('.',',')}: ${dec(S(f,CM))}×</text>`;}
document.getElementById('fig').innerHTML=s+'</svg>';
document.getElementById('side').innerHTML=
 `<p><b>f</b> — доля времени, которую можно поделить между ядрами. Остальное идёт на одном ядре при любом их числе, поэтому ускорение не превышает 1/(1 − f).</p>`+
 `<p>Справа — ускорение на ${CM} ядрах. При f = 0,5 потолок 2×, и уже на 8 ядрах получается ${dec(S(0.5,8))}×.</p>`;
</script>
