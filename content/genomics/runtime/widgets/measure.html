<!-- Fig. 1.2: runtime and peak memory vs cohort size, Schubert 2020 Fig. 2–3 (points digitized, N >= 500). -->
<style>
.w{font-family:var(--font-sans);display:grid;grid-template-columns:auto auto;column-gap:22px;row-gap:14px;align-items:start}
svg{display:block;overflow:visible}
svg text{font-family:var(--font-sans);font-size:11px;fill:var(--muted-foreground)}
svg .t{font-size:14px;font-weight:600;fill:var(--foreground)}
svg .lab{font-size:12px;font-weight:600}
svg .grid{stroke:var(--border);stroke-width:1}
.side{border-left:2px solid var(--border);padding-left:14px;font-size:13px;line-height:1.55;color:var(--muted-foreground);max-width:300px}
.side b{color:var(--foreground);font-weight:600}
.side p{margin:0 0 10px}
.side p:last-child{margin:0}
</style>
<div class="w"><div id="a"></div><div id="b"></div><div id="c"></div><div class="side" id="side"></div></div>
<script>
// Schubert, Andaleon & Wheeler 2020, PeerJ 8:e10090, Fig. 2 (hours) and Fig. 3 (GB); one run per size, one core
const N=[500,1000,1500,2000];
const D={
 RFMix:  {c:1,t:[5.19,22.30,65.22,146.56],m:[0.56,1.13,1.70,2.29]},
 Loter:  {c:2,t:[2.48,4.13,6.18,8.06],   m:[8.59,16.92,25.15,33.43]},
 ELAI:   {c:3,t:[3.96,7.17,10.74,14.17], m:[0.26,0.43,0.46,0.48]},
 'LAMP-LD':{c:4,t:[0.26,0.63,0.83,1.02], m:[2.59,5.36,7.88,10.51]},
 MOSAIC: {c:5,t:[6.61,13.38,18.01,11.00],m:[2.88,5.10,7.08,9.43]}};
const W=250,H=170,L=34,T=40,B=30,RL=70;
const dec=(x,d)=>x.toFixed(d).replace('.',',');
function chart({title,key,ymax,yt,only,band,unit,labels}){
 const x=n=>L+n/2000*W, y=v=>T+H-v/ymax*H;
 let s=`<svg width="${L+W+RL}" height="${T+H+B}"><text class="t" x="${L}" y="14">${title}</text>`;
 for(const v of yt)s+=`<line class="grid" x1="${L}" x2="${L+W}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`;
 for(const n of [0,500,1000,1500,2000])s+=`<text x="${x(n)}" y="${T+H+16}" text-anchor="middle">${n}</text>`;
 s+=`<text x="${L+W}" y="${T+H+29}" text-anchor="end">N, людей</text><text x="${L-6}" y="${T-6}" text-anchor="end">${unit}</text>`;
 if(band)s+=`<rect x="${L}" y="${y(band)}" width="${W}" height="${y(0)-y(band)}" fill="color-mix(in srgb,var(--foreground) 8%,transparent)"/>`;
 const ks=Object.keys(D).filter(only);
 for(const k of ks){const v=D[k][key],col=`var(--chart-${D[k].c})`;
  s+=`<polyline fill="none" stroke="${col}" stroke-width="2" points="${N.map((n,i)=>x(n)+','+y(v[i])).join(' ')}"/>`;
  s+=N.map((n,i)=>`<circle cx="${x(n)}" cy="${y(v[i])}" r="3.5" fill="${col}"/>`).join('');}
 // direct labels at the line ends, pushed apart to at least 13 px
 const lab=ks.filter(labels).map(k=>({k,y:y(D[k][key][3])+4})).sort((a,b)=>a.y-b.y);
 for(let i=1;i<lab.length;i++)if(lab[i].y-lab[i-1].y<13)lab[i].y=lab[i-1].y+13;
 for(let i=lab.length-2;i>=0;i--)if(lab[i+1].y-lab[i].y<13)lab[i].y=lab[i+1].y-13;
 for(const o of lab)s+=`<text class="lab" x="${L+W+8}" y="${o.y}" style="fill:var(--chart-${D[o.k].c})">${o.k}</text>`;
 return s+'</svg>';
}
document.getElementById('a').innerHTML=chart({title:'а. Время',key:'t',ymax:150,yt:[0,50,100,150],unit:'ч',band:20,only:()=>true,labels:k=>k=='RFMix'});
document.getElementById('b').innerHTML=chart({title:'б. Время, без RFMix',key:'t',ymax:20,yt:[0,5,10,15,20],unit:'ч',only:k=>k!='RFMix',labels:()=>true});
document.getElementById('c').innerHTML=chart({title:'в. Пик памяти',key:'m',ymax:35,yt:[0,10,20,30],unit:'ГБ',only:()=>true,labels:()=>true});
const r=(k,key)=>D[k][key][3]/D[k][key][1];  // growth when N doubles 1000 → 2000
document.getElementById('side').innerHTML=
 `<p><b>а.</b> Линия RFMix загибается вверх: при удвоении N с 1000 до 2000 время выросло в ${dec(r('RFMix','t'),1)} раза.</p>`+
 `<p><b>б.</b> Остальные идут почти по прямым: Loter ×${dec(r('Loter','t'),2)}, ELAI ×${dec(r('ELAI','t'),2)}, LAMP-LD ×${dec(r('LAMP-LD','t'),2)} за то же удвоение. MOSAIC на N = 2000 падает с ${dec(D.MOSAIC.t[2],1)} до ${dec(D.MOSAIC.t[3],1)} ч.</p>`+
 `<p><b>в.</b> Память у всех пяти растёт по прямым. Круче всех у Loter: ${dec(D.Loter.m[3],1)} ГБ при N = 2000.</p>`;
</script>
