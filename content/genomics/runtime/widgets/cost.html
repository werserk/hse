<!-- Fig. 1.2: time and peak memory of five LAI programs at N = 2000 (Schubert et al. 2020, Fig. 2-3, digitized)
     against the lower bounds of the task; log-log. All numbers are computed below from the data. -->
<style>
.w{font-family:var(--font-sans);display:grid;grid-template-columns:auto 1fr;column-gap:26px;align-items:start}
svg{display:block;overflow:visible}
svg text{font-family:var(--font-sans);font-size:11px;fill:var(--muted-foreground)}
svg .grid{stroke:var(--border)}
svg .nm{font-size:12px;font-weight:600}
svg .vl{font-size:11px;fill:var(--muted-foreground)}
svg .fl{font-size:11.5px;fill:var(--foreground)}
.side{border-left:2px solid var(--border);padding-left:14px;font-size:13px;line-height:1.55;color:var(--muted-foreground)}
.side b{color:var(--foreground);font-weight:600}
.side p{margin:0 0 10px}
.side p:last-child{margin:0}
</style>
<div class="w"><div id="fig"></div><div class="side" id="side"></div></div>
<script>
// run sizes: N people, p SNPs (assumed), 2n panel haplotypes (estimated); OPS: order of simple operations per second on one core
const N=2000,p=50000,n2=372,OPS=1e9;
const floorS=(2*N*p+n2*p+2*N*p)/OPS;            // read cohort + read panel + write answer
const floorB=(n2*p+p+p)/8;                       // panel + one haplotype + its answer, 1 bit each
// Schubert et al. 2020, Fig. 2 (hours) and Fig. 3 (GB), N = 2000, one core; [name, chart colour, hours, GB]
const D=[['LAMP-LD',4,1.02,10.51],['Loter',2,8.06,33.43],['MOSAIC',5,11.0,9.43],['ELAI',3,14.17,0.48],['RFMix',1,146.56,2.29]];
const pts=D.map(([k,c,h,g])=>({k,c,s:h*3600,b:g*1e9,h,g}));
const L=54,T=10,W=440,H=270,x0=-1,x1=6,y0=6,y1=11;   // log10 seconds 0.1 s…10^6 s; log10 bytes 1 MB…100 GB
const X=s=>L+(Math.log10(s)-x0)/(x1-x0)*W, Y=b=>T+H-(Math.log10(b)-y0)/(y1-y0)*H;
const dec=(v,d)=>v.toFixed(d).replace('.',',');
const xt=[[1,'1 с'],[60,'1 мин'],[3600,'1 ч'],[86400,'1 сут'],[604800,'1 нед']];
const yt=[[1e6,'1 МБ'],[1e7,'10 МБ'],[1e8,'100 МБ'],[1e9,'1 ГБ'],[1e10,'10 ГБ'],[1e11,'100 ГБ']];
let s=`<svg width="${L+W+12}" height="${T+H+40}">`;
for(const [v,l] of xt)s+=`<line class="grid" x1="${X(v)}" x2="${X(v)}" y1="${T}" y2="${T+H}"/><text x="${X(v)}" y="${T+H+15}" text-anchor="middle">${l}</text>`;
for(const [v,l] of yt)s+=`<line class="grid" x1="${L}" x2="${L+W}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end">${l}</text>`;
s+=`<text x="${L+W/2}" y="${T+H+33}" text-anchor="middle">время при N = ${N}, логарифмическая шкала</text>`;
// order-of-magnitude minimum of the task: dashed lines, not a hard bound, so no shaded "forbidden" region
const fx=X(floorS),fy=Y(floorB);
s+=`<path d="M${fx},${T} V${fy} H${L+W}" fill="none" stroke="var(--foreground)" stroke-dasharray="5 4" stroke-width="1.3"/>`;
s+=`<circle cx="${fx}" cy="${fy}" r="4.5" fill="var(--background)" stroke="var(--foreground)" stroke-width="1.6"/>`;
s+=`<text class="fl" x="${fx+9}" y="${fy-8}">минимум задачи: ${dec(floorS,1)} с, ${dec(floorB/1e6,1)} МБ</text>`;
// labels: name and values beside each point; side chosen so labels stay inside the plot
const lab={'LAMP-LD':['end',-9,4],'Loter':['end',-9,4],'MOSAIC':['middle',0,24],'ELAI':['end',-9,18],'RFMix':['end',5,26]};
for(const o of pts){const [a,dx,dy]=lab[o.k],col=`var(--chart-${o.c})`,cx=X(o.s),cy=Y(o.b);
 s+=`<circle cx="${cx}" cy="${cy}" r="5" fill="${col}"/>`;
 s+=`<text class="nm" x="${cx+dx}" y="${cy+dy-6}" text-anchor="${a}" style="fill:${col}">${o.k}</text>`;
 s+=`<text class="vl" x="${cx+dx}" y="${cy+dy+7}" text-anchor="${a}">${dec(o.h,1)} ч · ${o.g<1?dec(o.g,2):dec(o.g,1)} ГБ</text>`;}
document.getElementById('fig').innerHTML=s+'</svg>';
const mn=(a,f)=>a.reduce((m,o)=>f(o)<f(m)?o:m),mx=(a,f)=>a.reduce((m,o)=>f(o)>f(m)?o:m);
const tF=mn(pts,o=>o.s),tS=mx(pts,o=>o.s),mF=mn(pts,o=>o.b),mS=mx(pts,o=>o.b);
const ord=v=>Math.round(Math.log10(v));
document.getElementById('side').innerHTML=
 `<p><b>Пунктир</b> — порядок того, что требует сама задача: прочитать вход и записать ответ, держать в памяти панель и один гаплотип.</p>`+
 `<p><b>Время</b> программ — от ${dec(tF.h,1)} до ${dec(tS.h,1)} ч, разброс ×${Math.round(tS.s/tF.s)}. От пунктира — от ${ord(tF.s/floorS)} до ${ord(tS.s/floorS)} порядков.</p>`+
 `<p><b>Память</b> — от ${dec(mF.g,2)} до ${dec(mS.g,1)} ГБ, разброс ×${Math.round(mS.b/mF.b)}.</p>`+
 `<p>Самая быстрая программа (${tF.k}) не самая экономная (${mF.k}).</p>`;
</script>
