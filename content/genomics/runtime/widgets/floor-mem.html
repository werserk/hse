<!-- Fig. 1.3: memory lower bound of the LAI task (panel + one target) vs measured peak memory, log axis. -->
<style>
.w{font-family:var(--font-sans);display:grid;grid-template-columns:auto 1fr;column-gap:28px;align-items:start}
svg{display:block;overflow:visible}
svg text{font-family:var(--font-sans);font-size:11px;fill:var(--muted-foreground)}
svg .lab{font-size:12px;font-weight:600}
svg .grid{stroke:var(--border)}
.side{border-left:2px solid var(--border);padding-left:14px;font-size:13px;line-height:1.55;color:var(--muted-foreground)}
.side b{color:var(--foreground);font-weight:600}
.side p{margin:0 0 10px}
.side p:last-child{margin:0}
</style>
<div class="w"><div id="fig"></div><div class="side" id="side"></div></div>
<script>
const p=50000,n2=372;                                   // SNPs (assumed), panel haplotypes (estimated)
const MB=b=>b/8/1e6;                                    // bits -> MB
const floorMB=MB(n2*p)+MB(p)+MB(p);                     // panel + one target + its answer, 1 bit each (K = 2)
// Schubert et al. 2020, Fig. 3: peak memory, GB, one core
const NS=[500,1000,1500,2000];
const D=[['Loter',2,[8.59,16.92,25.15,33.43]],['LAMP-LD',4,[2.59,5.36,7.88,10.51]],['MOSAIC',5,[2.88,5.10,7.08,9.43]],
         ['RFMix',1,[0.56,1.13,1.70,2.29]],['ELAI',3,[0.26,0.43,0.46,0.48]]];
const L=56,W=300,T=12,Hh=230,RL=96,lo=0,hi=5;           // log10 MB: 1 MB .. 100 GB
const x=n=>L+(n/2000)*W, y=mb=>T+Hh-(Math.log10(mb)-lo)/(hi-lo)*Hh;
const yt=[[1,'1 МБ'],[10,'10 МБ'],[100,'100 МБ'],[1e3,'1 ГБ'],[1e4,'10 ГБ'],[1e5,'100 ГБ']];
let s=`<svg width="${L+W+RL}" height="${T+Hh+34}">`;
for(const [v,lab] of yt)s+=`<line class="grid" x1="${L}" x2="${L+W}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${lab}</text>`;
for(const n of [0,500,1000,1500,2000])s+=`<text x="${x(n)}" y="${T+Hh+16}" text-anchor="middle">${n}</text>`;
s+=`<text x="${L+W}" y="${T+Hh+30}" text-anchor="end">N, людей</text>`;
const labs=[];
for(const [k,c,v] of D){const col=`var(--chart-${c})`;
 s+=`<polyline fill="none" stroke="${col}" stroke-width="2" points="${NS.map((n,i)=>x(n)+','+y(v[i]*1e3)).join(' ')}"/>`+NS.map((n,i)=>`<circle cx="${x(n)}" cy="${y(v[i]*1e3)}" r="3.5" fill="${col}"/>`).join('');
 labs.push({k,col,y:y(v[3]*1e3)+4});}
s+=`<line x1="${x(0)}" x2="${x(2000)}" y1="${y(floorMB)}" y2="${y(floorMB)}" stroke="var(--foreground)" stroke-width="2" stroke-dasharray="6 4"/>`;
labs.push({k:'нижняя граница',col:'var(--foreground)',y:y(floorMB)+4});
labs.sort((a,b)=>a.y-b.y);
for(let i=1;i<labs.length;i++)if(labs[i].y-labs[i-1].y<13)labs[i].y=labs[i-1].y+13;
for(const o of labs)s+=`<text class="lab" x="${L+W+8}" y="${o.y}" style="fill:${o.col}">${o.k}</text>`;
document.getElementById('fig').innerHTML=s+'</svg>';
const dec=(v,d)=>v.toFixed(d).replace('.',',');
document.getElementById('side').innerHTML=
 `<p><b>Нижняя граница</b> (пунктир): панель ${dec(MB(n2*p),1)} МБ, одна цель и её ответ по ${dec(MB(p)*1e3,2)} КБ. Всего ${dec(floorMB,1)} МБ при любом N.</p>`+
 `<p><b>Замер</b>: пик памяти пяти программ растёт с N. При N = 2000 — от ${dec(D[4][2][3],1)} ГБ (ELAI) до ${dec(D[0][2][3],1)} ГБ (Loter).</p>`+
 `<p>Задача такого роста не требует.</p>`;
</script>
