<!-- Fig. 2.1: runtime (a) and peak memory (b) vs cohort size on log-log axes, Schubert 2020 Fig. 2-3 (digitized, N >= 500).
     Slope key alpha = 1 / 2 in panel a; side table gives alpha for the doubling 1000 -> 2000 for time and memory. -->
<style>
.w{font-family:var(--font-sans);display:grid;grid-template-columns:auto 1fr;column-gap:26px;align-items:start}
svg{display:block;overflow:visible}
svg text{font-family:var(--font-sans);font-size:11px;fill:var(--muted-foreground)}
svg .grid{stroke:var(--border)}
svg .lab{font-size:12px;font-weight:600}
svg .gd{font-size:11px;fill:var(--foreground)}
svg .ttl{font-size:13px;font-weight:600;fill:var(--foreground)}
.side{border-left:2px solid var(--border);padding-left:14px;font-size:13px;line-height:1.55;color:var(--muted-foreground)}
.side b{color:var(--foreground);font-weight:600}
.side p{margin:0 0 10px}
.side p:last-child{margin:0}
.side table{border-collapse:collapse;margin:2px 0 10px;font-size:13px}
.side th{font-weight:400;text-align:right;padding:0 0 4px 14px;color:var(--muted-foreground)}
.side td{padding:2px 0 2px 14px}
.side td:first-child{padding-left:0}
.side td.v{font-family:var(--font-mono);color:var(--foreground);text-align:right}
</style>
<div class="w"><div id="fig"></div><div class="side" id="side"></div></div>
<script>
// Schubert, Andaleon & Wheeler 2020, Fig. 2 (hours) and Fig. 3 (GB), one core, one point per size
const N=[500,1000,1500,2000];
const D={
 RFMix:{c:1,t:[5.19,22.30,65.22,146.56],m:[0.56,1.13,1.70,2.29]},
 Loter:{c:2,t:[2.48,4.13,6.18,8.06],m:[8.59,16.92,25.15,33.43]},
 ELAI:{c:3,t:[3.96,7.17,10.74,14.17],m:[0.26,0.43,0.46,0.48]},
 'LAMP-LD':{c:4,t:[0.26,0.63,0.83,1.02],m:[2.59,5.36,7.88,10.51]},
 MOSAIC:{c:5,t:[6.61,13.38,18.01,11.00],m:[2.88,5.10,7.08,9.43]}};
const L=46,W=300,H=190,RL=78,nx0=400,nx1=2500;
const dec=(v,d)=>v.toFixed(d).replace('.',',');
function panel(top,key,y0,y1,ticks,unit,title,keyline){
 const X=n=>L+Math.log(n/nx0)/Math.log(nx1/nx0)*W, Y=v=>top+H-Math.log(v/y0)/Math.log(y1/y0)*H;
 let s=`<text class="ttl" x="${L}" y="${top-14}">${title}</text>`;
 for(const n of N)s+=`<line class="grid" x1="${X(n)}" x2="${X(n)}" y1="${top}" y2="${top+H}"/><text x="${X(n)}" y="${top+H+15}" text-anchor="middle">${n}</text>`;
 for(const v of ticks)s+=`<line class="grid" x1="${L}" x2="${L+W}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end">${String(v).replace('.',',')}</text>`;
 s+=`<text x="${L-6}" y="${top-2}" text-anchor="end">${unit}</text>`;
 if(keyline){const [k0,k1,v0]=keyline;
  for(const [a,txt] of [[1,'α = 1: ×2'],[2,'α = 2: ×4']]){
   s+=`<line x1="${X(k0)}" y1="${Y(v0)}" x2="${X(k1)}" y2="${Y(v0*2**a)}" stroke="var(--foreground)" stroke-width="1.3" stroke-dasharray="5 4"/>`;
   s+=`<text class="gd" x="${X(k1)+5}" y="${Y(v0*2**a)+4}">${txt}</text>`;}
  s+=`<text x="${X(k0)}" y="${Y(v0)+14}">за удвоение N</text>`;}
 for(const [k,o] of Object.entries(D)){const col=`var(--chart-${o.c})`;
  s+=`<polyline fill="none" stroke="${col}" stroke-width="2" points="${N.map((n,i)=>X(n)+','+Y(o[key][i])).join(' ')}"/>`;
  s+=N.map((n,i)=>`<circle cx="${X(n)}" cy="${Y(o[key][i])}" r="3.5" fill="${col}"/>`).join('');}
 const lab=Object.keys(D).map(k=>({k,y:Y(D[k][key][3])+4})).sort((a,b)=>a.y-b.y);
 for(let i=1;i<lab.length;i++)if(lab[i].y-lab[i-1].y<13)lab[i].y=lab[i-1].y+13;
 for(const o of lab)s+=`<text class="lab" x="${X(2000)+8}" y="${o.y}" style="fill:var(--chart-${D[o.k].c})">${o.k}</text>`;
 return s;
}
const T1=36,T2=T1+H+66;
let s=`<svg width="${L+W+RL}" height="${T2+H+34}">`;
s+=panel(T1,'t',0.15,500,[0.3,1,3,10,30,100,300],'ч','а. Время',[500,1000,60]);
s+=panel(T2,'m',0.15,60,[0.3,1,3,10,30],'ГБ','б. Пик памяти',null);
s+=`<text x="${L+W}" y="${T2+H+30}" text-anchor="end">N, людей (обе оси логарифмические)</text>`;
document.getElementById('fig').innerHTML=s+'</svg>';
// alpha for the doubling 1000 -> 2000: value(2000)/value(1000) = 2^alpha
const al=(k,key)=>Math.log2(D[k][key][3]/D[k][key][1]);
const cell=(k,key)=>(k=='MOSAIC'&&key=='t')?'—':dec(al(k,key),2);
document.getElementById('side').innerHTML=
  `<p><b>α при удвоении N 1000 → 2000</b></p><table><tr><th></th><th>время</th><th>память</th></tr>`+
 ['Loter','ELAI','LAMP-LD','MOSAIC','RFMix'].map(k=>`<tr><td style="color:var(--chart-${D[k].c})">${k}</td><td class="v">${cell(k,'t')}</td><td class="v">${cell(k,'m')}</td></tr>`).join('')+`</table>`+
 `<p>Время MOSAIC при N = 2000 падает: эта пара не ложится на степенной закон.</p>`;
</script>
