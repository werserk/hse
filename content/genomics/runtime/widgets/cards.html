<!-- Fig. 4.1 (static): loop cards of RFMix, ELAI, LAMP-LD and MOSAIC in the template of Fig. 3.1.
     Lines whose repeat count depends on N are bold. Sources: RFMix 1.5.4 (indraniel/rfmix: main.cpp, randomforest.cpp),
     ELAI (haplotype/ELAI src/model.cpp, diploid.cpp; Guan 2014), LAMP-LD (Baran 2012; v1.0 source unavailable),
     MOSAIC v1.3.4 (mststats/MOSAIC mosaic.R, run.R, read_panels.R). Run settings: Schubert 2020 scripts
     (RFMix -e 2 -w 0.2; ELAI -C 2; LAMP-LD unolanc2way 300 15; MOSAIC without -n). Alphas: N = 1000 -> 2000 (chapter 2). -->
<style>
.w{font-family:var(--font-sans);display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px 8px}
.hd{display:flex;align-items:baseline;gap:8px;margin-bottom:2px}
.hd .sw{width:10px;height:10px;border-radius:2px;align-self:center}
.hd b{font-size:14px;color:var(--foreground)}
.hd .a{margin-left:auto;font:11px var(--font-mono);color:var(--muted-foreground)}
.ds{font-size:12px;line-height:1.45;color:var(--muted-foreground);margin-bottom:6px;min-height:34px}
.ln{display:grid;grid-template-columns:1fr auto;column-gap:10px;font:12px/1.7 var(--font-mono);color:var(--muted-foreground)}
.ln .c{text-align:right}
.ln.n{color:var(--brand);font-weight:600}
.mem{border-top:1px solid var(--border);margin-top:6px;padding-top:5px;font-size:12px;line-height:1.45;color:var(--foreground)}
.mem i{font-style:normal;color:var(--muted-foreground)}
</style>
<div class="w" id="w"></div>
<script>
// [indent, loop line, repeat count, depends on N]
const P=[
 {k:'RFMix',c:1,at:'2,7',am:'1,0',
  d:'Случайный лес на каждое окно; EM доучивает его на самой когорте.',
  L:[[0,'for шаг EM in 1..2','×2'],[1,'for окно in 1..W','×W'],[2,'for человек in 1..N','×N',1],
     [3,'лес на 2N−2 гаплотипах','∝ N · узлы',1],[3,'метки 2 гаплотипов','']],
  m:'по оценке, варианты фазировки и счётчики деревьев <i>— растут с N</i>'},
 {k:'ELAI',c:3,at:'1,0',am:'0,16',
  d:'Двухуровневая HMM: популяция × один из 10 кластеров похожих гаплотипов.',
  L:[[0,'for шаг EM in 1..20','×20'],[1,'for человек in 1..n+N','×(n+N)',1],[2,'for SNP in 1..p','×p'],
     [3,'пары состояний','×20²'],[1,'общие параметры модели','1 раз']],
  m:'генотипы, байт на SNP человека <i>— растут с N;</i> таблицы HMM, 2 × 160 МБ <i>— на одного человека за раз</i>'},
 {k:'LAMP-LD',c:4,at:'≈0,7',am:'1,0',
  d:'Окно из 300 SNP; на каждое окно и популяцию — HMM, обученная на панели.',
  L:[[0,'for окно, популяция','×(p/300)·2'],[1,'обучить HMM на панели','без N'],
     [0,'for человек in 1..N','×N',1],[1,'for окно in 1..p/300','×p/300'],[2,'правдоподобие при парах популяций','не от N'],
     [1,'HMM по окнам → метки','']],
  m:'≈5 МБ на человека <i>— растут с N; какие массивы — не видно, исходник v1.0 недоступен</i>'},
 {k:'MOSAIC',c:5,at:'—',am:'0,9',
  d:'Двухуровневая HMM копирования: доноры из панели и слой популяций.',
  L:[[0,'for раунд in 1..5','×5'],[1,'for шаг EM, пока прирост ≥ 1 %','≤ ×10'],
     [2,'for гаплотип in 1..2·min(N, 1000)','≤ ×2000',1],[3,'for точка сетки','×G'],
     [4,'популяция × донор','×2·100'],[2,'общие параметры модели','1 раз']],
  m:'при чтении — файл когорты целиком, в нескольких 8-байтовых копиях <i>— растёт с N, даже сверх 1000 человек</i>'}];
document.getElementById('w').innerHTML=P.map(p=>`<div class="card">
 <div class="hd"><span class="sw" style="background:var(--chart-${p.c})"></span><b>${p.k}</b><span class="a">α: время ${p.at}, память ${p.am}</span></div>
 <div class="ds">${p.d}</div>
 ${p.L.map(([i,t,c,n])=>`<div class="ln${n?' n':''}"><span>${'&nbsp;'.repeat(i)}${t.replace(/ /g,'&nbsp;')}</span><span class="c">${c}</span></div>`).join('')}
 <div class="mem">В пике памяти: ${p.m}</div></div>`).join('');
</script>
