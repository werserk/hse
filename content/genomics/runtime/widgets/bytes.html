<!-- Fig. 2.4: memory added per person (slope of peak memory vs N, Schubert 2020 Fig. 3, N = 500 -> 2000),
     divided by the 2p alleles of a person: bytes per allele, dot plot on a log axis, with 1 bit / 1 byte / 8 bytes marks. -->
<style>
.w{font-family:var(--font-sans);display:grid;grid-template-columns:auto 1fr;column-gap:26px;align-items:start}
svg{display:block;overflow:visible}
svg text{font-family:var(--font-sans);font-size:11px;fill:var(--muted-foreground)}
svg .grid{stroke:var(--border)}
svg .rl{font-size:12px;fill:var(--foreground)}
svg .v{font-size:12px;font-weight:600}
svg .mk{font-size:11px;fill:var(--foreground)}
.side{border-left:2px solid var(--border);padding-left:14px;font-size:13px;line-height:1.55;color:var(--muted-foreground)}
.side b{color:var(--foreground);font-weight:600}
.side p{margin:0 0 10px}
.side p:last-child{margin:0}
</style>
<div class="w"><div id="fig"></div><div class="side" id="side"></div></div>
<script>
const p=50000;                                   // SNPs (assumed, as in chapter 1)
const Ns=[500,1000,1500,2000];
// Schubert et al. 2020, Fig. 3: peak memory (GB) at N = 500, 1000, 1500, 2000; [name, chart colour, GB]
const D=[['Loter',2,[8.59,16.92,25.15,33.43]],['LAMP-LD',4,[2.59,5.36,7.88,10.51]],['MOSAIC',5,[2.88,5.10,7.08,9.43]],
 ['RFMix',1,[0.56,1.13,1.70,2.29]],['ELAI',3,[0.26,0.43,0.46,0.48]]];
const bpa=(g,i,j)=>(g[j]-g[i])*1e9/(Ns[j]-Ns[i])/(2*p);   // bytes per allele between sizes i and j
const rows=D.map(([k,c,g])=>({k,c,g,mb:(g[3]-g[0])*1e9/1500/1e6,bpa:bpa(g,0,3)}));
const L=72,T=40,W=380,RH=30,lo=-1.2,hi=3;        // log10 bytes per allele
const X=v=>L+(Math.log10(v)-lo)/(hi-lo)*W;
const H=T+rows.length*RH;
const dec=(v,d)=>v.toFixed(d).replace('.',',');
let s=`<svg width="${L+W+40}" height="${H+34}">`;
for(const v of [0.1,1,10,100,1000])s+=`<line class="grid" x1="${X(v)}" x2="${X(v)}" y1="${T-8}" y2="${H}"/><text x="${X(v)}" y="${H+15}" text-anchor="middle">${String(v).replace('.',',')}</text>`;
s+=`<text x="${L+W/2}" y="${H+31}" text-anchor="middle">байт на аллель, логарифмическая шкала</text>`;
// reference marks: what one allele takes in common representations
for(const [v,a,b] of [[1/8,'1 бит','упакованный'],[1,'1 байт','uint8'],[8,'8 байт','float64']])
 s+=`<line x1="${X(v)}" x2="${X(v)}" y1="${T-8}" y2="${H}" stroke="var(--foreground)" stroke-dasharray="4 3" stroke-width="1.2"/>`+
  `<text class="mk" x="${X(v)}" y="${T-26}" text-anchor="middle">${a}</text><text x="${X(v)}" y="${T-13}" text-anchor="middle">${b}</text>`;
rows.forEach((o,i)=>{const y=T+i*RH+RH/2,col=`var(--chart-${o.c})`;
 s+=`<line class="grid" x1="${L}" x2="${X(o.bpa)}" y1="${y}" y2="${y}" stroke-dasharray="1 3"/>`;
 s+=`<text class="rl" x="${L-10}" y="${y+4}" text-anchor="end">${o.k}</text>`;
 s+=`<circle cx="${X(o.bpa)}" cy="${y}" r="6" fill="${col}"/>`;
 s+=`<text class="v" x="${X(o.bpa)+11}" y="${y+4}" style="fill:${col}">${o.bpa<10?dec(o.bpa,1):Math.round(o.bpa)}</text>`;});
document.getElementById('fig').innerHTML=s+'</svg>';
const lo_=rows.find(o=>o.k=='Loter'),el=rows.find(o=>o.k=='ELAI');
const elP=[[0,1],[1,2],[2,3],[0,3]].map(([i,j])=>bpa(el.g,i,j));
document.getElementById('side').innerHTML=
 `<p><b>Байт на аллель</b> — сколько памяти добавляет один человек, делённое на его 2p = ${(2*p).toLocaleString('ru-RU')} аллелей.</p>`+
 `<p>Loter добавляет ${dec(lo_.mb,1)} МБ на человека, ≈${Math.round(lo_.bpa)} байт на аллель. Сами аллели при 1 бите занимают ${dec(2*p/8/1e3,1)} КБ.</p>`+
 `<p>Память ELAI растёт неровно: по разным парам N выходит от ${dec(Math.min(...elP),1)} до ${dec(Math.max(...elP),1)} байт на аллель.</p>`;
</script>
