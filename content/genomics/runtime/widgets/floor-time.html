<!-- Fig. 1.2: time lower bound of the LAI task vs measured runtimes at N = 2000 (log axis). -->
<style>
.w{font-family:var(--font-sans);display:grid;grid-template-columns:auto 1fr;column-gap:28px;align-items:start}
svg{display:block;overflow:visible}
svg text{font-family:var(--font-sans);font-size:11px;fill:var(--muted-foreground)}
svg .rl{font-size:12px;fill:var(--foreground)}
svg .v{font-size:12px;font-weight:600}
svg .grid{stroke:var(--border)}
.side{border-left:2px solid var(--border);padding-left:14px;font-size:13px;line-height:1.55;color:var(--muted-foreground)}
.side b{color:var(--foreground);font-weight:600}
.side p{margin:0 0 10px}
.side p:last-child{margin:0}
</style>
<div class="w"><div id="fig"></div><div class="side" id="side"></div></div>
<script>
// run sizes (notes.md, «Вход и выход»): N people, p SNPs (assumed), 2n panel haplotypes (estimated)
const N=2000,p=50000,n2=372, OPS=1e9;           // OPS: order of simple operations per second on one core (assumption)
const ops=2*N*p + n2*p + 2*N*p;                 // read cohort + read panel + write answer
const floorS=ops/OPS;
// Schubert et al. 2020, Fig. 2, N = 2000, one core (hours)
const M=[['LAMP-LD',4,1.02],['Loter',2,8.06],['MOSAIC',5,11.0],['ELAI',3,14.17],['RFMix',1,146.56]];
const rows=[['нижняя граница',null,floorS],...M.map(([k,c,h])=>[k,c,h*3600])];
const L=110,W=360,RH=30,T=8,lo=-1,hi=6;            // log10 seconds from 0.1 s to 10^6 s
const x=s=>L+(Math.log10(s)-lo)/(hi-lo)*W;
const ticks=[[1,'1 с'],[60,'1 мин'],[3600,'1 ч'],[86400,'1 сут'],[604800,'1 нед']];
const dec=(v,d)=>v.toFixed(d).replace('.',',');
const fmtS=s=>s<60?dec(s,1)+' с':dec(s/3600,1)+' ч';
const H=T+rows.length*RH;
let s=`<svg width="${L+W+70}" height="${H+30}">`;
for(const [t,lab] of ticks)s+=`<line class="grid" x1="${x(t)}" x2="${x(t)}" y1="${T-4}" y2="${H}"/><text x="${x(t)}" y="${H+16}" text-anchor="middle">${lab}</text>`;
rows.forEach(([k,c,sec],i)=>{const y=T+i*RH, col=c?`var(--chart-${c})`:'var(--foreground)';
 s+=`<text class="rl" x="${L-10}" y="${y+16}" text-anchor="end">${k}</text>`;
 s+=`<rect x="${L}" y="${y+5}" width="${x(sec)-L}" height="16" rx="3" fill="${col}" opacity="${c?0.85:0.35}"/>`;
 s+=`<text class="v" x="${x(sec)+6}" y="${y+17}" style="fill:${col}">${fmtS(sec)}</text>`;});
s+=`<text x="${L+W}" y="${H+29}" text-anchor="end">время при N = ${N}, логарифмическая шкала</text></svg>`;
document.getElementById('fig').innerHTML=s;
const ord=v=>Math.round(Math.log10(v));
document.getElementById('side').innerHTML=
 `<p><b>Нижняя граница</b> — ${dec(ops/1e8,1)}·10⁸ операций: прочитать когорту и панель, записать ответ. При 10⁹ простых операций в секунду это ${dec(floorS,1)} с.</p>`+
 `<p><b>Замер</b> пяти программ на одном ядре: от ${dec(M[0][2],1)} до ${dec(M[4][2],1)} ч.</p>`+
 `<p>Разрыв — около ${ord(M[0][2]*3600/floorS)} порядков у LAMP-LD и ${ord(M[4][2]*3600/floorS)} у RFMix. Его вносит алгоритм.</p>`;
</script>
