<style>
.w{display:flex;flex-direction:column;gap:9px;font-family:var(--font-sans)}
.r{display:flex;align-items:center;gap:10px}
.l{width:105px;text-align:right;font-size:12px;color:var(--muted-foreground)}
.bw{flex:1;position:relative;padding-top:7px}
.bar{position:relative;height:20px;border-radius:4px;overflow:hidden}
.bar div{position:absolute;top:0;bottom:0}
.bar i{position:absolute;top:0;bottom:0;width:1px;background:var(--background)}
.bw b{position:absolute;top:0;width:0;height:0;margin-left:-4px;border:4px solid transparent;border-top:6px solid var(--foreground)}
.n{width:210px;font-size:12px;color:var(--muted-foreground)}
.lg{display:flex;gap:14px;font-size:12px;margin-left:115px;color:var(--muted-foreground)}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.tri{display:inline-block;width:0;height:0;border:4px solid transparent;border-top:6px solid var(--foreground);vertical-align:-3px;margin-right:4px}
</style>
<div class="w">
<div class="lg"><span><i class="sw" style="background:var(--chart-1)"></i>популяция A</span><span><i class="sw" style="background:var(--chart-2)"></i>популяция B</span><span><i class="tri"></i>новые разрезы</span><span>хромосома 100 cM</span></div>
<div id="rows" class="w"></div>
</div>
<script>
let s=11;const rnd=()=>{s=(s*16807)%2147483647;return s/2147483647};
const cuts=[0.55,0.22,0.8,0.38,...[...Array(96)].map(rnd)];
const T=[[1,'0 разрезов'],[2,'1 разрез'],[5,'4 разреза · куски ≈ 20 cM'],[20,'19 разрезов · куски ≈ 5 cM'],[100,'99 разрезов · куски ≈ 1 cM']];
function segs(n){let S=[[0,1,1]];for(const c of cuts.slice(0,n)){const k=S.findIndex(x=>x[0]<c&&c<x[1]);const [a,b,p]=S[k];S.splice(k,1,[a,c,p],[c,b,3-p])}return S}
document.getElementById('rows').innerHTML=T.map(([t,note],j)=>{const prev=j?T[j-1][0]:1;
 const bar=segs(t-1).map(([a,b,p])=>`<div style="left:${a*100}%;width:${(b-a)*100}%;background:var(--chart-${p})"></div>`).join('')+cuts.slice(0,t-1).map(c=>`<i style="left:${c*100}%"></i>`).join('');
 const marks=t-prev<=20?cuts.slice(prev-1,t-1).map(c=>`<b style="left:${c*100}%"></b>`).join(''):'';
 return `<div class="r"><div class="l">${t} ${t==1?'поколение':t<5?'поколения':'поколений'}</div><div class="bw">${marks}<div class="bar">${bar}</div></div><div class="n">${note}</div></div>`}).join('');
</script>
