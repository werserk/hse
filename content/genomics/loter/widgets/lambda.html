<style>
.g{display:grid;grid-template-columns:auto 1fr;column-gap:28px;font-family:var(--font-sans);align-items:start}
table{border-collapse:collapse}
th{font-size:13px;font-weight:600;text-align:left;padding:0 0 6px 6px}
th small{display:block;font-weight:400;color:var(--muted-foreground);font-size:12px}
td{padding:3px 6px}
td.l{font-size:12px;color:var(--muted-foreground);text-align:right;white-space:nowrap;padding-left:0}
td.l b{color:var(--foreground);font-family:var(--font-mono);font-weight:600}
tr.sep td{border-top:1px solid var(--border);padding-top:7px}
.s{display:flex;gap:2px;align-items:center;font-family:var(--font-mono);font-size:12px}
.s span{width:19px;height:21px;display:flex;align-items:center;justify-content:center;border-radius:3px}
.h span{background:var(--muted);font-weight:600}
.s span.A{background:var(--chart-1);color:var(--background);font-weight:600}
.s span.B{background:var(--chart-2);color:var(--background);font-weight:600}
.s em{font-style:normal;width:18px;margin-left:6px;font-size:14px;font-weight:700;text-align:center}
.ok{color:var(--success)}.no{color:var(--destructive)}
.n{font-size:13px;line-height:1.55;color:var(--muted-foreground);border-left:2px solid var(--border);padding-left:14px}
.n b{color:var(--foreground)}
</style>
<div class="g">
<table id="t"></table>
<div class="n">
Референс A — все 0, референс B — все 1. Под чертой — ответ Loter при трёх λ.<br><br>
Кусок остаётся, если <b>d &gt; 2λ</b>.<br><br>
<b>λ = 0.5</b>: шум принят за кусок B.<br>
<b>λ = 1.5</b>: оба случая верно.<br>
<b>λ = 2.5</b>: настоящий кусок стёрт.
</div>
</div>
<script>
const C=[{t:'Настоящий кусок B',d:4,h:'00111100',truth:'AABBBBAA'},{t:'Шум внутри A',d:2,h:'00011000',truth:'AAAAAAAA'}];
const L=[0.5,1.5,2.5];
const seq=(s,cls,mark)=>`<div class="s ${cls}">${[...s].map(c=>`<span class="${cls?'':c}">${c}</span>`).join('')}${mark||''}</div>`;
// Loter's answer: the B-run stays iff d > 2λ
const ans=(c,l)=>c.d>2*l?c.h.replace(/./g,x=>x=='1'?'B':'A'):'A'.repeat(c.h.length);
let r=`<tr><th></th>${C.map(c=>`<th>${c.t}<small>d = ${c.d}</small></th>`).join('')}</tr>`;
r+=`<tr><td class="l">цель h</td>${C.map(c=>`<td>${seq(c.h,'h')}</td>`).join('')}</tr>`;
r+=`<tr><td class="l">истина</td>${C.map(c=>`<td>${seq(c.truth,'')}</td>`).join('')}</tr>`;
L.forEach((l,i)=>{r+=`<tr class="${i==0?'sep':''}"><td class="l"><b>λ = ${l}</b><br>2λ = ${2*l}</td>${C.map(c=>{const a=ans(c,l),ok=a==c.truth;return `<td>${seq(a,'',`<em class="${ok?'ok':'no'}">${ok?'✓':'✗'}</em>`)}</td>`}).join('')}</tr>`});
document.getElementById('t').innerHTML=r;
</script>
