<style>
.w{font-family:var(--font-sans)}
.top{display:flex;align-items:center;gap:6px;margin:0 0 14px}
.top button{font:13px var(--font-sans);height:28px;padding:0 10px;border:1px solid var(--border);border-radius:var(--radius);background:var(--card);color:var(--foreground);cursor:pointer}
.top button:disabled{opacity:.35;cursor:default}
.top span{font-size:12px;color:var(--muted-foreground);margin-left:6px}
.g{display:grid;grid-template-columns:auto 1fr;column-gap:28px;align-items:start}
.bt{margin:12px 0 6px 34px;font-size:14px;font-weight:600;color:var(--foreground)}
.bt:first-child{margin-top:0}
.r{display:flex;align-items:center;gap:10px;margin:3px 0}
.l{width:24px;text-align:right;font:12px var(--font-mono);color:var(--muted-foreground)}
.s{display:flex;gap:3px;font-family:var(--font-mono);font-size:13px}
.s span{box-sizing:border-box;width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:4px;transition:background .3s,color .3s}
.idx span{height:14px;font-size:10px;color:var(--subtle-foreground)}
.q span{background:var(--muted);color:var(--foreground)}
.q span.jmp{box-shadow:inset 4px 0 0 var(--warning)}
.q span.onA{background:var(--chart-1);color:var(--background);font-weight:600}
.q span.onB{background:var(--chart-2);color:var(--background);font-weight:600}
.m span{border:1px solid var(--border);font-weight:600}
.p span{font-size:11px;border:1px dashed var(--border)}
.p span:empty,.a span:empty{border:1px dashed var(--border);background:transparent}
.a span{color:var(--background);font-weight:600}
.s span.cur{outline:2px solid var(--foreground);outline-offset:-2px}
.s span.src{outline:2px dashed var(--foreground);outline-offset:1px}
#fig{position:relative}
.vl{position:absolute;width:2px;background:var(--warning);border-radius:1px}
.sep{margin:10px 0 10px 34px;border-top:1px solid var(--border)}
.txt{padding:9px 6px 9px 0;border-top:1px solid var(--border);font-size:13px;line-height:1.5;color:var(--subtle-foreground);cursor:pointer;display:grid;grid-template-columns:22px 1fr;gap:8px}
.txt:first-child{border-top:0;padding-top:0}
.txt .n{width:20px;height:20px;border-radius:50%;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px}
.txt b{display:block;color:inherit}
.txt .d{display:none}
.txt.done{color:var(--muted-foreground)}
.txt.on{color:var(--foreground)}
.txt.on .d{display:block}
.txt.on .n{background:var(--brand);border-color:var(--brand);color:var(--background)}
.txt.on b{color:var(--brand)}
.jk{display:inline-block;width:12px;height:12px;border-radius:2px;background:var(--muted);box-shadow:inset 4px 0 0 var(--warning);vertical-align:-1px}
.mk{display:inline-block;width:2px;height:12px;background:var(--warning);vertical-align:-1px;margin:0 2px}
</style>
<div class="w">
<div class="top"><button id="prev">◀ назад</button><button id="next">дальше ▶</button><span id="cnt"></span></div>
<div class="g"><div id="fig"></div><div id="steps"></div></div>
</div>
<script>
const N=['A1','A2','B1','B2'],H=['0010001000','0100000010','1111101111','1011111101'],h='0011101010',L=1,R=4,P=10;
// the same DP as Fig. 3.1; ties keep the reference (as in Loter's code)
const mis=(i,j)=>+(H[i][j]!=h[j]),Q=[],J=[],M=[];
for(let i=0;i<R;i++){Q.push([mis(i,0)]);J.push([false])}
M.push(Math.min(...Q.map(r=>r[0])));
for(let j=1;j<P;j++){for(let i=0;i<R;i++){const st=Q[i][j-1],sw=M[j-1]+L;Q[i][j]=mis(i,j)+Math.min(st,sw);J[i][j]=sw<st}M.push(Math.min(...Q.map(r=>r[j])))}
// backtracking: a marked cell came from the minimum of the previous column, an unmarked one from its left neighbour
const argmin=j=>Q.map(r=>r[j]).indexOf(M[j]),path=Array(P);path[P-1]=argmin(P-1);
for(let j=P-1;j>0;j--)path[j-1]=J[path[j]][j]?argmin(j-1):path[j];
const pop=j=>N[path[j]][0],nsw=path.filter((x,j)=>j&&x!=path[j-1]).length,nmm=path.filter((x,j)=>mis(x,j)).length;
// back = columns revealed from the right; anc = ancestry cells filled from the left; focus = [row, col] of the cell whose arrival is explained
const S=[
 {t:'Старт: минимум последнего столбца',back:1,anc:0,focus:P-1,d:`Таблица Q из рис. 3.1. Лучший путь кончается в клетке с минимумом последнего столбца: ${N[path[P-1]]}, цена ${M[P-1]}. Значит, на SNP ${P} путь копирует ${N[path[P-1]]}. Дальше идём справа налево и для каждой клетки выясняем, откуда в неё пришли.`},
 {t:'SNP 10 и 9 без меток → SNP 9 и 8',back:3,anc:0,ms:900,focus:P-2,d:`У клетки ${N[path[P-1]]}, SNP ${P} нет метки <span class="jk"></span>: в неё пришли, оставшись на том же референсе. Значит, на SNP ${P-1} путь тоже копирует ${N[path[P-2]]}. Так же из клетки SNP ${P-1} получаем SNP ${P-2}.`},
 {t:'SNP 8 с меткой → SNP 7',back:4,anc:0,ms:900,focus:P-4,d:`У клетки ${N[path[7]]}, SNP 8 есть метка: в неё пришли переключением с минимума столбца 7. Минимум столбца 7 равен ${M[6]}, он в строке ${N[path[6]]}. Значит, на SNP 7 путь копирует ${N[path[6]]}, а между SNP 7 и 8 стоит переключение <span class="mk"></span>.`},
 {t:'SNP 7–4 без меток → SNP 6–3',back:8,anc:0,ms:650,d:`В строке ${N[path[3]]} на SNP 7…4 меток нет, путь остаётся на ${N[path[3]]}. На SNP 4 оба варианта стоили одинаково, и по договорённости путь остался на референсе (рис. 3.1, шаг 5). Переключение там дало бы другой путь той же цены: A1 до SNP 3 включительно.`},
 {t:'SNP 3 с меткой → SNP 2 и 1',back:10,anc:0,ms:650,d:`У клетки ${N[path[2]]}, SNP 3 метка: переключение с минимума столбца 2, это ${N[path[1]]} (${M[1]}). У ${N[path[1]]}, SNP 2 метки нет, поэтому на SNP 1 тоже ${N[path[0]]}.`},
 {t:'Путь s и происхождение a',back:10,anc:P,ms:250,d:`Восстановлен путь из рис. 2.1: ${nmm} несовпадений и ${nsw} переключения, цена ${nmm} + ${nsw}·λ = ${nmm+nsw*L} — ровно минимум последнего столбца. Заменяем референсы популяциями и получаем ответ LAI: ${path.map((x,j)=>pop(j)).join('')}.`}];
let k=0,back=0,anc=0,cur=-1,timer=null;window.stepperBusy=false;
const $=id=>document.getElementById(id);
const row=(lab,cls,f)=>`<div class="r"><div class="l">${lab}</div><div class="s ${cls}">${Array.from({length:P},(_,j)=>f(j)).join('')}</div></div>`;
const seen=j=>j>=P-back;
function fig(){
 // the cell just reached and the cell it was reached from
 const c=cur>=0?cur:(!window.stepperBusy&&S[k].focus!=null?S[k].focus:-1);
 const from=c>=0&&c<P-1?c+1:-1; // explain the arrival into column c+1, which led to column c
 return `<div class="bt">Таблица Q, λ = ${L}</div>`+row('','idx',j=>`<span>${j+1}</span>`)+
  N.map((n,i)=>row(n,'q',j=>`<span class="${J[i][j]?'jmp':''} ${seen(j)&&path[j]==i?'on'+n[0]:''} ${c==j&&path[j]==i?'cur':''} ${from==j&&path[j]==i?'src':''}">${Q[i][j]}</span>`)).join('')+
  row('min','m',j=>`<span class="${c==j&&from>=0&&J[path[from]][from]?'src':''}">${M[j]}</span>`)+
  `<div class="sep"></div>`+
  row('s','p',j=>`<span>${seen(j)?N[path[j]]:''}</span>`)+
  row('a','a',j=>j<anc?`<span style="background:var(--chart-${pop(j)=='A'?1:2})">${pop(j)}</span>`:'<span></span>');
}
function lines(){
 // offset* are layout px, unaffected by the page zoom applied to the widget
 const F=$('fig'),rows=[...F.querySelectorAll('.s.p,.s.a')],top=rows[0].offsetTop-3,last=rows[rows.length-1],bot=last.offsetTop+last.offsetHeight+3;
 for(let j=1;j<P;j++)if(seen(j-1)&&path[j]!=path[j-1])F.insertAdjacentHTML('beforeend',`<div class="vl" style="left:${rows[0].children[j].offsetLeft-2.5}px;top:${top}px;height:${bot-top}px"></div>`);
}
function draw(){
 $('fig').innerHTML=fig();lines();
 $('steps').innerHTML=S.map((s,i)=>`<div class="txt ${i==k?'on':i<k?'done':''}" data-i="${i}"><span class="n">${i+1}</span><span><b>${s.t}</b><span class="d">${s.d}</span></span></div>`).join('');
 $('prev').disabled=k==0;$('next').disabled=k==S.length-1;$('cnt').textContent=`шаг ${k+1} из ${S.length}`;
}
function go(i){
 clearInterval(timer);window.stepperBusy=false;cur=-1;i=Math.max(0,Math.min(S.length-1,i));
 const fwd=i==k+1,s=S[i];k=i;
 if(fwd&&s.ms&&(s.back>back||s.anc>anc)){ // animate only one step forward; end in the full static state
  const key=s.anc>anc?'anc':'back';window.stepperBusy=true;
  const t=timer=setInterval(()=>{if(key=='back'){back++;cur=P-back}else anc++;draw();
   if((key=='back'?back:anc)>=s[key]){clearInterval(t);setTimeout(()=>{if(timer===t){cur=-1;window.stepperBusy=false;draw()}},s.ms)}},s.ms);
  draw();return;
 }
 back=s.back;anc=s.anc;draw();
}
$('prev').onclick=()=>go(k-1);$('next').onclick=()=>go(k+1);
document.addEventListener('click',e=>{const t=e.target.closest('[data-i]');if(t)go(+t.dataset.i)});
// reserve the tallest step-list height, so the frame does not resize between steps
let hmax=0;for(k=0;k<S.length;k++){draw();hmax=Math.max(hmax,$('steps').offsetHeight)}
k=0;$('steps').style.minHeight=hmax+'px';draw();
</script>
