<!-- Fig. 5.3: Loter's diploid accuracy for recent (5 generations) and ancient (500) admixture; only the endpoints given in the paper text. -->
<style>
svg text{font:11px var(--font-sans);fill:var(--muted-foreground)}
svg text.lab{fill:var(--foreground);font-size:12px}
svg text.v{font:600 12px var(--font-mono);fill:var(--foreground)}
</style>
<svg id="s" width="520" height="230"></svg>
<script>
// paper, Results: human CEU-YRI 99.3% at 5 generations, 86.7% at 500; Populus 89.9% at 5, 89.0% at 500
const D=[{lab:'Тополь',a:89.9,b:89.0,c:'var(--foreground)'},{lab:'Человек',a:99.3,b:86.7,c:'var(--muted-foreground)'}];
const X0=120,X1=330,Y=v=>20+(100-v)/(100-84)*170;
let s='';
for(let v=85;v<=100;v+=5)s+=`<line x1="${X0-30}" y1="${Y(v)}" x2="${X1+30}" y2="${Y(v)}" style="stroke:var(--border);stroke-dasharray:${v==100?'0':'2 3'}"/><text x="${X0-36}" y="${Y(v)+4}" text-anchor="end">${v}%</text>`;
s+=`<text x="${X0}" y="216" text-anchor="middle">5 поколений</text><text x="${X1}" y="216" text-anchor="middle">500 поколений</text>`;
D.forEach(d=>{s+=`<line x1="${X0}" y1="${Y(d.a)}" x2="${X1}" y2="${Y(d.b)}" style="stroke:${d.c};stroke-width:2"/>`;
 for(const [x,v] of [[X0,d.a],[X1,d.b]])s+=`<circle cx="${x}" cy="${Y(v)}" r="4" style="fill:${d.c}"/>`;
 s+=`<text class="v" x="${X1+10}" y="${Y(d.b)+4}">${d.b.toFixed(1)}%</text><text class="v" x="${X0+10}" y="${Y(d.a)-8}">${d.a.toFixed(1)}%</text>`;
 s+=`<text class="lab" x="${X1+62}" y="${Y(d.b)+4}">${d.lab}</text>`});
document.getElementById('s').innerHTML=s;
</script>
