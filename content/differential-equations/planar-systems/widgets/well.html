<!-- Fig. 12.1: energy conservation traps the motion: V(x) = x^2/2 + x^4/4 in 1D, level E < m(eps) = V(eps). -->
<style>
.g{display:grid;grid-template-columns:auto 1fr;column-gap:28px;align-items:start;font-family:var(--font-sans)}
svg text{font:12px var(--font-sans);fill:var(--foreground)}
svg .ax{font:11px var(--font-mono);fill:var(--muted-foreground)}
.n{font-size:13px;line-height:1.55;color:var(--muted-foreground);border-left:2px solid var(--border);padding-left:14px;max-width:290px}
.n b{color:var(--foreground)}.n p{margin:0 0 9px}
.t{font-size:14px;font-weight:600;margin:0 0 8px;color:var(--foreground)}
</style>
<div class="g"><div><div class="t">Потенциал V(x) и уровень энергии E</div><svg id="s" viewBox="0 0 400 260" style="width:400px;max-width:100%;height:auto"></svg></div><div class="n" id="n"></div></div>
<script>
const V=x=>x*x/2+x**4/4,W=400,H=260,L=20,B=34,XM=1.5,YM=2.4;
const px=v=>L+(v+XM)/(2*XM)*(W-L-10), py=v=>H-B-v/YM*(H-B-10);
const eps=1.0,m=V(eps),E=0.55*m;                       // m(eps) = min V on |x| = eps; start with E < m(eps)
const xe=Math.sqrt(-1+Math.sqrt(1+4*E)); // V(x)=E -> x^2 = -1 + sqrt(1+4E)
let s='';
const c=[];for(let x=-XM;x<=XM+1e-9;x+=0.02)c.push(px(x).toFixed(1)+','+py(V(x)).toFixed(1));
s+=`<rect x="${px(-eps)}" y="10" width="${px(eps)-px(-eps)}" height="${py(0)-10}" style="fill:color-mix(in srgb,var(--chart-1) 12%,transparent)"/>`;
s+=`<line x1="${px(-XM)}" y1="${py(0)}" x2="${px(XM)}" y2="${py(0)}" style="stroke:var(--border)"/>`;
s+=`<line x1="${px(-XM)}" y1="${py(m)}" x2="${px(XM)}" y2="${py(m)}" style="stroke:var(--warning);stroke-dasharray:5 4;stroke-width:1.5"/>`;
s+=`<line x1="${px(-XM)}" y1="${py(E)}" x2="${px(XM)}" y2="${py(E)}" style="stroke:var(--brand);stroke-width:2"/>`;
s+=`<polyline fill="none" style="stroke:var(--foreground);stroke-width:2" points="${c.join(' ')}"/>`;
for(const x of [-xe,xe])s+=`<line x1="${px(x)}" y1="${py(E)}" x2="${px(x)}" y2="${py(0)}" style="stroke:var(--brand);stroke-dasharray:2 3"/>`;
s+=`<line x1="${px(-xe)}" y1="${py(0)+12}" x2="${px(xe)}" y2="${py(0)+12}" style="stroke:var(--brand);stroke-width:3"/>`;
s+=`<circle cx="${px(0)}" cy="${py(0)}" r="4.5" style="fill:var(--foreground)"/>`;
for(const x of [-eps,eps])s+=`<line x1="${px(x)}" y1="${py(0)-4}" x2="${px(x)}" y2="${py(0)+4}" style="stroke:var(--foreground)"/><text class="ax" x="${px(x)}" y="${py(0)+27}" text-anchor="middle">${x<0?'−ε':'ε'}</text>`;
s+=`<text class="ax" x="${px(0)}" y="${py(0)+27}" text-anchor="middle">0</text>`;
s+=`<text x="${px(0)}" y="${py(m)-6}" text-anchor="middle" style="fill:var(--warning)">m(ε) = V(ε)</text><text x="${px(0)}" y="${py(E)-6}" text-anchor="middle" style="fill:var(--brand)">E</text><text x="${px(XM)-4}" y="${py(V(1.35))-22}" text-anchor="end">V(x)</text>`;
document.getElementById('s').innerHTML=s;
document.getElementById('n').innerHTML=`<p>Кинетическая энергия не бывает отрицательной, поэтому в любой момент <b>V(x) ≤ E</b>. Пока E &lt; m(ε), прямая E лежит ниже стенок ямы на |x| = ε, и точка не может выйти из интервала (−ε, ε).</p><p>Здесь потенциал V = x²/2 + x⁴/4 (одна степень свободы, n = 1), ε = ${eps}, E = ${E.toFixed(2)} &lt; m(ε) = ${m.toFixed(2)}: движение идёт внутри |x| ≤ ${xe.toFixed(2)}.</p>`;
</script>
