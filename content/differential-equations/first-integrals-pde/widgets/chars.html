<!-- Fig. 6.1: characteristics of y z_x - x z_y = 0 are circles x^2+y^2=R^2; two Cauchy data curves near (1,0): x=1 touches the circle, x=1+y crosses every circle once. -->
<style>
.w{font-family:var(--font-sans)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:28px}
svg text{font:12px var(--font-sans);fill:var(--foreground)}
svg .ax{font:11px var(--font-mono);fill:var(--muted-foreground)}
.t{font-size:14px;font-weight:600;margin:0 0 2px;color:var(--foreground)}
.c{font-size:13px;line-height:1.55;color:var(--muted-foreground);border-left:2px solid var(--border);padding-left:14px;margin-top:6px}
.c b{color:var(--foreground)}
.ok{color:var(--success);font-weight:600}.no{color:var(--destructive);font-weight:600}
</style>
<div class="w"><div class="row" id="r"></div></div>
<script>
const W=300,H=250,X0=0.2,X1=2.0,Y0=-0.9,Y1=0.9;
const px=v=>10+(v-X0)/(X1-X0)*(W-20), py=v=>H-12-(v-Y0)/(Y1-Y0)*(H-24);
function circle(R,st){let p=[];for(let a=-1.4;a<=1.4;a+=0.02){const x=R*Math.cos(a),y=R*Math.sin(a);if(x>=X0&&x<=X1&&y>=Y0&&y<=Y1)p.push(px(x).toFixed(1)+','+py(y).toFixed(1))}
 return `<polyline fill="none" style="${st}" points="${p.join(' ')}"/>`}
const dot=(x,y,c,r=4)=>`<circle cx="${px(x)}" cy="${py(y)}" r="${r}" style="fill:var(${c});stroke:var(--background);stroke-width:1.2"/>`;
function panel(title,curve,extra,cap){
 let s=`<svg width="${W}" height="${H}"><line x1="${px(X0)}" y1="${py(0)}" x2="${px(X1)}" y2="${py(0)}" style="stroke:var(--border)"/>`;
 for(const R of [0.7,0.85,1.0,1.15,1.3,1.5,1.7])s+=circle(R,`stroke:var(--chart-1);opacity:${R==1?1:.55};stroke-width:${R==1?2:1.2}`);
 s+=curve+extra+dot(1,0,'--foreground',4.5)+`<text x="${px(1)-6}" y="${py(0)+16}" text-anchor="end" class="ax">(1, 0)</text></svg>`;
 return `<div><div class="t">${title}</div>${s}<div class="c">${cap}</div></div>`}
const s0=0.5;
// (a) x = 1
const A=panel('а) данные на прямой x = 1',
 `<line x1="${px(1)}" y1="${py(Y0)}" x2="${px(1)}" y2="${py(Y1)}" style="stroke:var(--brand);stroke-width:2.2"/>`,
 dot(1,s0,'--brand')+dot(1,-s0,'--brand')+`<text x="${px(1)+8}" y="${py(s0)+4}" style="font-weight:600">z = 2s</text><text x="${px(1)+8}" y="${py(-s0)+4}" style="font-weight:600">z = −2s</text>`,
 `Прямая <b>касается</b> окружности R = 1 в точке (1, 0). Точки (1, s) и (1, −s) лежат на одной окружности, а данные в них разные: 2s и −2s. <span class="no">Решения нет.</span>`);
// (b) x = 1+y
const B=panel('б) данные на прямой x = 1 + y',
 `<line x1="${px(1+Y0)}" y1="${py(Y0)}" x2="${px(1+Y1)}" y2="${py(Y1)}" style="stroke:var(--brand);stroke-width:2.2"/>`,
 [-0.4,-0.2,0.2,0.4].map(s=>dot(1+s,s,'--brand',3.5)).join(''),
 `Прямая <b>пересекает</b> каждую окружность около (1, 0) один раз, значение z на окружности определено однозначно. <span class="ok">Решение есть и единственно.</span>`);
document.getElementById('r').innerHTML=A+B;
</script>
