<!-- Static figures of "Цепи Маркова: сходимость и возвратность". Mode from the iframe's data-mode:
     squeeze — Fig 1.2: column 1 of P^n for the 3x3 matrix of Fig 1.1, band [m_n, M_n], range vs 0.6^n;
     regular — Fig 1.3: first coordinate of mu'P^n for the three chains of slides 11-12, p = 1 and p = 0;
     lazy    — Fig 2.1: cyclic chain of slide 13, P^n_{1,1} vs lazy M = I/2 + P/2, M^n_{1,1} -> 1/8;
     walks   — Fig 3.1: partial sums of P^n_{0,0} for three random walks.
     Every number is computed here from the matrices. -->
<meta charset="utf-8">
<style>
*{box-sizing:border-box}
.w{font-family:var(--font-sans);color:var(--foreground)}
.g{display:grid;grid-template-columns:auto 1fr;column-gap:28px;align-items:start}
.figs{display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap}
.ttl{font-size:14px;font-weight:600;color:var(--foreground);margin:0 0 6px}
.sub{font-size:12px;color:var(--muted-foreground);margin:-4px 0 6px}
.side{border-left:2px solid var(--border);padding-left:14px;font-size:13px;line-height:1.55;color:var(--muted-foreground)}
.side b{color:var(--foreground)}
.c1,.side b.c1{color:var(--chart-1)}.c2,.side b.c2{color:var(--chart-2)}.c3,.side b.c3{color:var(--chart-3)}.cw{color:var(--warning)}
svg text{font-family:var(--font-sans);font-size:11px;fill:var(--muted-foreground)}
svg .ax{stroke:var(--border)}
svg .tk{font-size:10px;fill:var(--subtle-foreground)}
@media(max-width:640px){.g{grid-template-columns:1fr}.side{border-left:0;border-top:2px solid var(--border);padding:8px 0 0;margin-top:10px}}
</style>
<div class="w"><div class="g"><div id="fig" class="figs"></div><div class="side" id="side"></div></div></div>
<script>
const $=id=>document.getElementById(id);
const mode=(window.frameElement&&window.frameElement.dataset.mode)||'squeeze';
const mul=(A,B)=>A.map(r=>B[0].map((_,j)=>r.reduce((s,a,k)=>s+a*B[k][j],0)));
const powers=(P,N)=>{const I=P.map((r,i)=>r.map((_,j)=>+(i==j)));const out=[I];for(let n=1;n<=N;n++)out.push(mul(out[n-1],P));return out};
const f=(x,d=3)=>(+x.toFixed(d)).toString().replace('.',',').replace('-','−');
// ---- graph helpers (same as in "Классы и стационарность")
const R=17;
function arrow(x1,y1,cx,cy,x2,y2,col,w=1.5){
 const dx=x2-cx,dy=y2-cy,L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L,s=7,bx=x2-ux*s,by=y2-uy*s,px=-uy*s*.5,py=ux*s*.5;
 return `<path d="M${x1} ${y1}Q${cx} ${cy} ${bx} ${by}" fill="none" stroke="${col}" stroke-width="${w}"/><polygon points="${x2},${y2} ${bx+px},${by+py} ${bx-px},${by-py}" fill="${col}"/>`}
function edge(N,a,b,bend,lab,col='var(--muted-foreground)'){
 const [x1,y1]=N[a],[x2,y2]=N[b],dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L,nx=-uy,ny=ux;
 const cx=(x1+x2)/2+nx*bend,cy=(y1+y2)/2+ny*bend;
 const s=(px,py)=>{const vx=px-x1,vy=py-y1,l=Math.hypot(vx,vy);return [x1+vx/l*R,y1+vy/l*R]};
 const e=(px,py)=>{const vx=px-x2,vy=py-y2,l=Math.hypot(vx,vy);return [x2+vx/l*R,y2+vy/l*R]};
 const [sx,sy]=s(cx,cy),[ex,ey]=e(cx,cy);
 const tx=(x1+x2)/2+nx*(bend*.5+(bend>=0?11:-11)),ty=(y1+y2)/2+ny*(bend*.5+(bend>=0?11:-11))+4;
 return arrow(sx,sy,cx,cy,ex,ey,col)+`<text x="${tx}" y="${ty}" text-anchor="middle" font-size="12">${lab}</text>`}
function node(N,a,col){const [x,y]=N[a];return `<circle cx="${x}" cy="${y}" r="${R}" fill="color-mix(in srgb,${col} 18%,var(--card))" stroke="${col}" stroke-width="1.6"/><text x="${x}" y="${y+5}" text-anchor="middle" font-size="14" font-weight="600" style="fill:var(--foreground)">${a}</text>`}
// ---- chart helper; series {p:[[x,y]],c,dots,dash}; bands [[x,lo,hi]]; hl {y,t,c}
let cid=0;
function chart({w=330,h=200,xmax,ymin=0,ymax=1,series=[],hl=[],xt=[],yt=[],xl='n',bands=null,lab=[]}){
 const L=38,Rr=10,T=10,B=28,X=x=>L+(w-L-Rr)*x/xmax,Y=y=>T+(h-T-B)*(1-(y-ymin)/(ymax-ymin)),id='c'+(cid++);
 let s=`<clipPath id="${id}"><rect x="${L}" y="${T-4}" width="${w-L-Rr+4}" height="${h-T-B+8}"/></clipPath>`;
 s+=`<line class="ax" x1="${L}" y1="${Y(ymin)}" x2="${w-Rr}" y2="${Y(ymin)}"/><line class="ax" x1="${L}" y1="${T}" x2="${L}" y2="${Y(ymin)}"/>`;
 for(const t of xt)s+=`<text class="tk" x="${X(t)}" y="${h-B+14}" text-anchor="middle">${t}</text>`;
 for(const t of yt)s+=`<text class="tk" x="${L-5}" y="${Y(t[0])+3}" text-anchor="end">${t[1]}</text>`;
 s+=`<text x="${w-Rr}" y="${h-3}" text-anchor="end">${xl}</text>`;
 if(bands)for(const [x,lo,hi] of bands){const bw=(w-L-Rr)/xmax*.42;s+=`<rect x="${X(x)-bw/2}" y="${Y(hi)}" width="${bw}" height="${Math.max(1,Y(lo)-Y(hi))}" rx="3" fill="color-mix(in srgb,var(--chart-1) 20%,transparent)"/>`}
 for(const l of hl)s+=`<line x1="${L}" x2="${w-Rr}" y1="${Y(l.y)}" y2="${Y(l.y)}" stroke="${l.c||'var(--warning)'}" stroke-dasharray="5 4"/><text x="${w-Rr}" y="${Y(l.y)-5}" text-anchor="end" style="fill:${l.c||'var(--warning)'}">${l.t}</text>`;
 s+=`<g clip-path="url(#${id})">`;
 for(const se of series){
  if(se.line!==false)s+=`<polyline fill="none" stroke="${se.c}" stroke-width="1.6" ${se.dash?'stroke-dasharray="4 3"':''} points="${se.p.map(([x,y])=>X(x)+','+Y(y)).join(' ')}"/>`;
  if(se.dots!==false)s+=se.p.map(([x,y])=>`<circle cx="${X(x)}" cy="${Y(y)}" r="${se.r||3}" fill="${se.c}"/>`).join('')}
 s+=`</g>`;
 for(const t of lab)s+=`<text x="${X(t.x)}" y="${Y(t.y)+(t.dy||0)}" text-anchor="${t.a||'start'}" style="fill:${t.c}">${t.t}</text>`;
 return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${s}</svg>`}

if(mode=='squeeze'){
 const P=[[.5,.3,.2],[.2,.6,.2],[.3,.2,.5]],N=6,Pw=powers(P,N),eps=Math.min(...P.flat());
 const col=n=>Pw[n].map(r=>r[0]),Mx=n=>Math.max(...col(n)),mn=n=>Math.min(...col(n));
 // stationary pi_1 from a high power
 const pi1=powers(P,200)[200][0][0];
 const pts=[];for(let n=0;n<=N;n++)col(n).forEach(v=>pts.push([n,v]));
 const bands=[...Array(N+1).keys()].map(n=>[n,mn(n),Mx(n)]);
 const rng=[...Array(N+1).keys()].map(n=>[n,Mx(n)-mn(n)]),bnd=[...Array(N+1).keys()].map(n=>[n,(1-2*eps)**n]);
 $('fig').innerHTML=`<div><div class="ttl">Столбец 1 матрицы Pⁿ</div>${chart({w:300,xmax:N+.5,series:[{p:pts,c:'var(--chart-1)',line:false}],bands,hl:[{y:pi1,t:'π₁ = 16/49'}],xt:[0,1,2,3,4,5,6],yt:[[0,'0'],[.5,'0,5'],[1,'1']]})}</div>`+
  `<div><div class="ttl">Размах Mₙ − mₙ</div>${chart({w:260,xmax:N+.5,series:[{p:bnd,c:'var(--warning)',dash:true,r:2.5},{p:rng,c:'var(--chart-1)'}],xt:[0,1,2,3,4,5,6],yt:[[0,'0'],[.5,'0,5'],[1,'1']],lab:[{x:1.15,y:bnd[1][1],t:'0,6ⁿ',c:'var(--warning)',dy:-6}]})}</div>`;
 $('side').innerHTML=`Полоса — от m<sub>n</sub> до M<sub>n</sub>: верх не растёт, низ не падает.<br><br><b>Размах:</b> ${rng.map(([,v])=>f(v,4)).join('; ')}.<br><span class="cw">Оценка 0,6ⁿ:</span> ${bnd.map(([,v])=>f(v,4)).join('; ')}.<br><br>Фактически размах падает примерно в ${f(rng[3][1]/rng[4][1],1)}–${f(rng[1][1]/rng[2][1],1)} раза за шаг, а лемма гарантирует только 1/0,6 ≈ 1,7.`;
}
if(mode=='regular'){
 document.querySelector('.g').style.gridTemplateColumns='1fr';Object.assign($('side').style,{borderLeft:'0',borderTop:'2px solid var(--border)',padding:'8px 0 0',marginTop:'10px'});
 const C=[[[.5,.5],[.5,.5]],[[.8,.2],[.2,.8]],[[.2,.8],[.8,.2]]],N=8;
 const xt=[0,2,4,6,8],yt=[[0,'0'],[.5,'0,5'],[1,'1']];
 $('fig').innerHTML=C.map((P,c)=>{const Pw=powers(P,N),s1=Pw.map((M,n)=>[n,M[0][0]]),s0=Pw.map((M,n)=>[n,M[1][0]]);
  return `<div><div class="ttl">P = (${P.map(r=>r.map(v=>f(v)).join('; ')).join(' | ')})</div>${chart({w:240,h:170,xmax:N,series:[{p:s1,c:'var(--chart-1)'},{p:s0,c:'var(--chart-2)'}],hl:[{y:.5,t:''}],xt,yt})}</div>`}).join('');
 const mu=(P,n,p)=>{const Pw=powers(P,n)[n];return p*Pw[0][0]+(1-p)*Pw[1][0]};
 $('side').innerHTML=`Первая координата μ<sub>n</sub>:<br><b class="c1">●</b> старт из 1 (p = 1),<br><b class="c2">●</b> старт из 2 (p = 0).<br><br>Вторая цепь: размах ${[1,2,3,4].map(n=>f(mu(C[1],n,1)-mu(C[1],n,0),4)).join('; ')} — множитель 0,6.<br>Третья: разность ${[1,2,3,4].map(n=>f(mu(C[2],n,1)-mu(C[2],n,0),4)).join('; ')} — множитель −0,6, отсюда колебания.`;
}
if(mode=='lazy'){
 $('fig').style.flexDirection='column';$('fig').style.gap='10px';
 const h=.5,P=[[0,1,0,0,0],[h,0,h,0,0],[0,h,0,h,0],[0,0,h,0,h],[0,0,0,1,0]],N=20,Pw=powers(P,N);
 const M=P.map((r,i)=>r.map((v,j)=>.5*(i==j)+.5*v)),Mw=powers(M,N);
 const G={};for(let i=1;i<=5;i++)G[i]=[30+(i-1)*72,58];
 const fr={0.5:'1/2',1:'1'};let g='';
 for(let i=1;i<5;i++){g+=edge(G,i,i+1,-22,fr[P[i-1][i]]);g+=edge(G,i+1,i,-22,fr[P[i][i-1]])}
 for(let i=1;i<=5;i++)g+=node(G,i,i%2?'var(--chart-1)':'var(--chart-2)');
 const sP=Pw.map((A,n)=>[n,A[0][0]]),sM=Mw.map((A,n)=>[n,A[0][0]]);
 $('fig').innerHTML=`<div><div class="ttl">Граф P: <span class="c1">C₀ = {1, 3, 5}</span>, <span class="c2">C₁ = {2, 4}</span></div><svg width="350" height="116" viewBox="0 0 350 116">${g}</svg></div>`+
  `<div><div class="ttl">P<sup>n</sup><sub>1,1</sub> и M<sup>n</sup><sub>1,1</sub></div>${chart({w:440,xmax:N,series:[{p:sP,c:'var(--chart-1)'},{p:sM,c:'var(--chart-3)'}],hl:[{y:1/8,t:''}],xt:[0,4,8,12,16,20],yt:[[0,'0'],[.5,'0,5'],[1,'1']]})}</div>`;
 $('side').innerHTML=`<b class="c1">●</b> P<sup>n</sup><sub>1,1</sub>: 0 при нечётных n, при чётных ${[2,4,6,8].map(n=>f(Pw[n][0][0],4)).join('; ')}… → 1/4. Предела нет.<br><br><b class="c3">●</b> M<sup>n</sup><sub>1,1</sub>, M = ½I + ½P: ${[1,2,3,4].map(n=>f(Mw[n][0][0],4)).join('; ')}…, при n = 20 — ${f(Mw[20][0][0],4)}. Петли с вероятностью ½ убирают период, и предел равен π₁ = 1/8 — тому же, что у P (<span class="cw">пунктир</span>).`;
}
if(mode=='walks'){
 const N=200;
 // distribution of X_n from X_0 = 0; Z walks on [-N-1, N+1], reflecting walk on [0, N+1]
 function sums(step,lo,hi){let d={};for(let k=lo;k<=hi;k++)d[k]=0;d[0]=1;let S=0;const out=[[0,0]];
  for(let n=1;n<=N;n++){const e={};for(let k=lo;k<=hi;k++)e[k]=0;for(let k=lo;k<=hi;k++)if(d[k])for(const [t,p] of step(k))if(t>=lo&&t<=hi)e[t]+=d[k]*p;d=e;S+=d[0];out.push([n,S])}return out}
 const sym=sums(k=>[[k+1,.5],[k-1,.5]],-N-1,N+1),drift=sums(k=>[[k+1,.6],[k-1,.4]],-N-1,N+1),refl=sums(k=>k==0?[[1,.4],[0,.6]]:[[k+1,.4],[k-1,.6]],0,N+1);
 const at=(s,n)=>s[n][1];
 $('fig').innerHTML=`<div><div class="ttl">Σ<sub>n≤N</sub> P<sup>n</sup><sub>0,0</sub> — среднее число возвращений в 0</div>${chart({w:420,h:240,xmax:N,ymax:72,xl:'N',series:[{p:refl,c:'var(--chart-3)',dots:false},{p:sym,c:'var(--chart-1)',dots:false},{p:drift,c:'var(--chart-2)',dots:false}],hl:[{y:4,t:'4',c:'var(--chart-2)'}],xt:[0,50,100,150,200],yt:[[0,'0'],[20,'20'],[40,'40'],[60,'60']]})}</div>`;
 $('side').innerHTML=`<b class="c3">●</b> блуждание с отражением в 0 (0,4 вверх): ${[50,100,200].map(n=>f(at(refl,n),1)).join('; ')} при N = 50, 100, 200 — растёт как N/3.<br><b class="c1">●</b> симметричное на ℤ: ${[50,100,200].map(n=>f(at(sym,n),1)).join('; ')} — растёт как √N, неограниченно.<br><b class="c2">●</b> на ℤ со сносом 0,6: ${[50,100,200].map(n=>f(at(drift,n),2)).join('; ')} → 4 = f/(1 − f) при f = 0,8.<br><br>Сумма бесконечна — возвратное, конечна — проходное.`;
}
</script>
<script>/*fit-width*/(function(){var d=document.documentElement;function f(){d.style.zoom="";var w=d.clientWidth,s=d.scrollWidth;if(s>w+1)d.style.zoom=Math.max(.5,w/s)}addEventListener("load",f);addEventListener("resize",f);addEventListener("click",function(){setTimeout(f,60)});setTimeout(f,200)})()</script>
