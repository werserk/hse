<!-- Fig 1.1 of "Цепи Маркова на непрерывном множестве состояний": AR(1) chain X_{n+1} = 0.8 X_n + eps, eps ~ N(0, 0.36),
     started at 3. Left: densities P^n(3, .) = N(3*0.8^n, 1 - 0.64^n) for n = 1, 2, 4, 8 and pi = N(0, 1);
     right: their total-variation distance to pi, by numerical integration. Every number is computed here. -->
<meta charset="utf-8">
<style>
*{box-sizing:border-box}
.w{font-family:var(--font-sans);color:var(--foreground)}
.figs{display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap}
.ttl{font-size:14px;font-weight:600;color:var(--foreground);margin:0 0 6px}
.side{border-top:2px solid var(--border);padding-top:8px;margin-top:10px;font-size:13px;line-height:1.55;color:var(--muted-foreground)}
.side b{color:var(--foreground)}
.c1{color:var(--chart-1)}.c2{color:var(--chart-2)}.cw{color:var(--warning)}.ok{color:var(--success)}.no{color:var(--destructive)}
svg text{font-family:var(--font-sans);font-size:11px;fill:var(--muted-foreground)}
svg .ax{stroke:var(--border)}
svg .tk{font-size:10px;fill:var(--subtle-foreground)}
</style>
<div class="w"><div id="fig" class="figs"></div><div class="side" id="side"></div></div>
<script>
const $=id=>document.getElementById(id);
const f=(x,d=3)=>(+x.toFixed(d)).toString().replace('.',',').replace('-','−');
const npdf=(x,m,v)=>Math.exp(-((x-m)**2)/(2*v))/Math.sqrt(2*Math.PI*v);
let cid=0;
function chart({w=330,h=200,xmin=0,xmax,ymin=0,ymax=1,series=[],bars=[],hl=[],seg=[],xt=[],yt=[],xl='',lab=[],L=38}){
 const Rr=10,T=10,B=28,X=x=>L+(w-L-Rr)*(x-xmin)/(xmax-xmin),Y=y=>T+(h-T-B)*(1-(y-ymin)/(ymax-ymin)),id='c'+(cid++);
 let s=`<clipPath id="${id}"><rect x="${L}" y="${T-4}" width="${w-L-Rr+4}" height="${h-T-B+8}"/></clipPath>`;
 s+=`<line class="ax" x1="${L}" y1="${h-B}" x2="${w-Rr}" y2="${h-B}"/><line class="ax" x1="${L}" y1="${T}" x2="${L}" y2="${h-B}"/>`;
 for(const t of xt)s+=`<text class="tk" x="${X(t[0])}" y="${h-B+14}" text-anchor="middle">${t[1]}</text>`;
 for(const t of yt)s+=`<text class="tk" x="${L-5}" y="${Y(t[0])+3}" text-anchor="end">${t[1]}</text>`;
 s+=`<text x="${w-Rr}" y="${h-3}" text-anchor="end">${xl}</text>`;
 for(const l of hl)s+=`<line x1="${L}" x2="${w-Rr}" y1="${Y(l.y)}" y2="${Y(l.y)}" stroke="${l.c||'var(--warning)'}" stroke-dasharray="5 4"/>`+(l.t?`<text x="${w-Rr}" y="${Y(l.y)-5}" text-anchor="end" style="fill:${l.c||'var(--warning)'}">${l.t}</text>`:'');
 s+=`<g clip-path="url(#${id})">`;
 for(const b of bars){const bw=Math.max(1.5,(w-L-Rr)/(xmax-xmin)*.35);for(const [x,y] of b.p)s+=`<rect x="${X(x)-bw/2}" y="${Math.min(Y(y),Y(0))}" width="${bw}" height="${Math.max(1,Math.abs(Y(0)-Y(y)))}" fill="${b.c}"/>`}
 for(const [x1,y1,x2,y2,c,sw] of seg)s+=`<line x1="${X(x1)}" y1="${Y(y1)}" x2="${X(x2)}" y2="${Y(y2)}" stroke="${c}" stroke-width="${sw||1.4}"/>`;
 for(const se of series){
  if(se.line!==false)s+=`<polyline fill="none" stroke="${se.c}" stroke-width="${se.w||1.6}" ${se.dash?'stroke-dasharray="5 4"':''} points="${se.p.map(([x,y])=>X(x).toFixed(1)+','+Y(y).toFixed(1)).join(' ')}"/>`;
  if(se.dots)s+=se.p.map(([x,y])=>`<circle cx="${X(x)}" cy="${Y(y)}" r="${se.r||3}" fill="${se.c}"/>`).join('')}
 s+=`</g>`;
 for(const t of lab)s+=`<text x="${X(t.x)}" y="${Y(t.y)+(t.dy||0)}" text-anchor="${t.a||'start'}" style="fill:${t.c||'var(--muted-foreground)'}">${t.t}</text>`;
 return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${s}</svg>`}
const grid=(a,b,h)=>{const o=[];for(let x=a;x<=b+1e-9;x+=h)o.push(x);return o};
{
 const rho=.8,x0=3,ns=[1,2,4,8],xs=grid(-3.5,4.5,.02);
 const tv=n=>{const m=x0*rho**n,v=1-rho**(2*n);let s=0;for(let x=-12;x<12;x+=.001)s+=Math.abs(npdf(x,m,v)-npdf(x,0,1))*.001;return s/2};
 const op=[1,.75,.55,.4];
 const ser=ns.map((n,j)=>({p:xs.map(x=>[x,npdf(x,x0*rho**n,1-rho**(2*n))]),c:`color-mix(in srgb,var(--chart-1) ${op[j]*100}%,transparent)`}));
 ser.push({p:xs.map(x=>[x,npdf(x,0,1)]),c:'var(--warning)',dash:true});
 const lab=ns.map((n,j)=>{const m=x0*rho**n;return n==2?{x:m-.08,y:npdf(m,m,1-rho**(2*n)),t:'n = 2',a:'end',dy:-4,c:'var(--chart-1)'}:{x:m,y:npdf(m,m,1-rho**(2*n)),t:'n = '+n,a:'middle',dy:-5,c:'var(--chart-1)'}}); // n = 2 sits left of its peak: the n = 1 curve crosses the centred spot
 const tvs=[...Array(21).keys()].map(n=>[n,n==0?1:tv(n)]);
 $('fig').innerHTML=`<div><div class="ttl">Плотность X<sub>n</sub> при X<sub>0</sub> = 3: p<sup>(n)</sup>(3, y)</div>${chart({w:380,h:210,xmin:-3.5,xmax:4.5,ymax:.72,series:ser,xt:[[-3,'−3'],[-2,'−2'],[-1,'−1'],[0,'0'],[1,'1'],[2,'2'],[3,'3'],[4,'4']],yt:[[0,'0'],[.2,'0,2'],[.4,'0,4'],[.6,'0,6']],xl:'y',lab:[...lab,{x:-1.75,y:npdf(-1.75,0,1),t:'π = 𝒩(0, 1)',c:'var(--warning)',dy:-4,a:'end'}],seg:[[3,0,3,.72,'var(--border)',1]]})}</div>`+
 `<div><div class="ttl">‖P<sup>n</sup>(3, ·) − π‖<sub>TV</sub></div>${chart({w:250,h:210,xmax:20.5,series:[{p:tvs,c:'var(--chart-1)',dots:true,r:2.5}],xt:[[0,'0'],[5,'5'],[10,'10'],[15,'15'],[20,'20']],yt:[[0,'0'],[.5,'0,5'],[1,'1']],xl:'n'})}</div>`;
 $('side').innerHTML=`Цепь X<sub>n+1</sub> = 0,8·X<sub>n</sub> + ε<sub>n</sub>, ε<sub>n</sub> ~ 𝒩(0; 0,36), старт в точке 3 (серая вертикаль). Через n шагов X<sub>n</sub> ~ 𝒩(3·0,8<sup>n</sup>; 1 − 0,64<sup>n</sup>): ${ns.map(n=>`n = ${n}: 𝒩(${f(x0*rho**n,2)}; ${f(1-rho**(2*n),2)})`).join(', ')}.<br>`+
  `<b>Расстояние по полной вариации:</b> ${[1,2,4,8,15].map(n=>`n = ${n}: ${f(tv(n),2)}`).join('; ')} — убывает примерно в 0,8 раза за шаг.`;
}
</script>
<script>/*fit-width*/(function(){var d=document.documentElement;function f(){d.style.zoom="";var w=d.clientWidth,s=d.scrollWidth;if(s>w+1)d.style.zoom=Math.max(.5,w/s)}addEventListener("load",f);addEventListener("resize",f);addEventListener("click",function(){setTimeout(f,60)});setTimeout(f,200)})()</script>
