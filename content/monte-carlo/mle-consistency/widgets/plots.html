<!-- Static plots of the mle-consistency konspekt; the figure is chosen by data-mode on the iframe.
     Every number is computed here from the model definitions and seeded samples, never typed by hand. -->
<meta charset="utf-8">
<style>
*{box-sizing:border-box}
.w{font-family:var(--font-sans);color:var(--foreground)}
.row{display:flex;gap:30px;flex-wrap:wrap;align-items:flex-start}
.g{display:grid;grid-template-columns:auto 1fr;column-gap:28px;align-items:start}
.side{border-left:2px solid var(--border);padding-left:14px;font-size:13px;line-height:1.55;color:var(--muted-foreground)}
.side b{color:var(--foreground)}
.ttl{font-size:14px;font-weight:600;color:var(--foreground);margin:0 0 6px}
.note{font-size:12.5px;line-height:1.5;color:var(--muted-foreground);margin-top:4px;max-width:380px}
.ok{color:var(--success,var(--chart-3));font-weight:600}.no{color:var(--destructive,var(--chart-1));font-weight:600}
svg text{font-family:var(--font-sans);font-size:11px;fill:var(--muted-foreground)}
svg .ax{stroke:var(--border)}
.lg{display:flex;flex-direction:column;gap:3px;margin:8px 0;font:12px var(--font-mono);color:var(--muted-foreground)}
.sw{display:inline-block;width:14px;height:3px;vertical-align:3px;margin-right:6px}
</style>
<div class="w" id="fig"></div>
<script>
const mode=(window.frameElement&&window.frameElement.dataset.mode)||'views';
const $=id=>document.getElementById(id);
function lgam(x){const c=[76.18009172947146,-86.50532032941677,24.01409824083091,-1.231739572450155,0.1208650973866179e-2,-0.5395239384953e-5];let y=x,t=x+5.5;t-=(x+0.5)*Math.log(t);let s=1.000000000190015;for(const q of c)s+=q/++y;return -t+Math.log(2.5066282746310005*s/x)}
const N=(x,m,v)=>Math.exp(-((x-m)**2)/(2*v))/Math.sqrt(2*Math.PI*v);
const beta=(x,a,b)=>x<=0||x>=1?0:Math.exp((a-1)*Math.log(x)+(b-1)*Math.log(1-x)+lgam(a+b)-lgam(a)-lgam(b));
const binom=(k,n,q)=>Math.exp(lgam(n+1)-lgam(k+1)-lgam(n-k+1)+k*Math.log(q)+(n-k)*Math.log(1-q));
const lfact=k=>lgam(k+1);
const lpois=(k,l)=>k*Math.log(l)-l-lfact(k);
// true distribution outside the Poisson family: negative binomial, r = 2, mean 4, variance 12
const r=2,pp=r/(r+4),lnb=k=>lgam(k+r)-lgam(r)-lfact(k)+r*Math.log(pp)+k*Math.log(1-pp);
const K=80,KS=[...Array(K).keys()];
const f=(x,d=2)=>{let t=x.toFixed(d);if(/^-0\.?0*$/.test(t))t=t.slice(1);return t.replace('.',',').replace(/^-/,'−')};
const C=i=>`var(--chart-${i})`;
function frame(W,H,o){
 const L=o.L??40,R=o.R??10,T=o.T??10,B=o.B??34;
 const X=x=>L+(W-L-R)*(x-o.x0)/(o.x1-o.x0),Y=y=>T+(H-T-B)*(1-(y-o.y0)/(o.y1-o.y0));
 let s=`<line class="ax" x1="${L}" y1="${Y(Math.max(o.y0,0))}" x2="${W-R}" y2="${Y(Math.max(o.y0,0))}"/><line class="ax" x1="${L}" y1="${T}" x2="${L}" y2="${H-B}"/>`;
 (o.xt||[]).forEach(v=>s+=`<text x="${X(v)}" y="${H-B+14}" text-anchor="middle">${String(v).replace('.',',')}</text>`);
 (o.yt||[]).forEach(v=>s+=`<text x="${L-5}" y="${Y(v)+4}" text-anchor="end">${String(v).replace('.',',').replace('-','−')}</text>`);
 if(o.xl)s+=`<text x="${W-R}" y="${H-3}" text-anchor="end" fill="var(--subtle-foreground)">${o.xl}</text>`;
 const cid=`c${W}${H}${L}${o.id||''}`;
 return {X,Y,s,L,R,T,B,W,H,cid,clip:`<clipPath id="${cid}"><rect x="${L}" y="${T-2}" width="${W-L-R}" height="${H-T-B+2}"/></clipPath>`};
}
function path(F,fn,x0,x1,n=300){let d='';for(let i=0;i<=n;i++){const x=x0+(x1-x0)*i/n;d+=(i?'L':'M')+F.X(x).toFixed(1)+' '+F.Y(fn(x)).toFixed(1)}return d}
const svg=(F,inner,over='')=>`<svg width="${F.W}" height="${F.H}" viewBox="0 0 ${F.W} ${F.H}"><defs>${F.clip}</defs>${F.s}<g clip-path="url(#${F.cid})">${inner}</g>${over}</svg>`;
const vline=(F,x,col,lab,dx=4,anchor='start')=>`<line x1="${F.X(x)}" y1="${F.T}" x2="${F.X(x)}" y2="${F.H-F.B}" stroke="${col}" stroke-dasharray="3 3"/>`+(lab?`<text x="${F.X(x)+dx}" y="${F.T+9}" text-anchor="${anchor}" fill="${col}">${lab}</text>`:'');
function mulberry32(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function sample(lp,n,seed){const R=mulberry32(seed),c=[];let a=0;KS.forEach(k=>{a+=Math.exp(lp(k));c.push(a)});
 return [...Array(n)].map(()=>{const u=R();let k=0;while(k<K-1&&c[k]<=u)k++;return k})}

// thumbtack of chapter 3: D10 has 3 heads; prior Beta(2, 2)
const n10=10,h10=3,q0=0.3;

// ---------- Fig 1.1: classical sampling distribution vs Bayesian posterior ----------
if(mode==='views'){
 const w=[...Array(n10+1).keys()].map(k=>binom(k,n10,q0));
 const E=w.reduce((a,p,k)=>a+p*k/n10,0),MSE=w.reduce((a,p,k)=>a+p*(k/n10-q0)**2,0);
 const A=frame(370,200,{x0:-0.05,x1:1.05,y0:0,y1:0.3,xt:[0,0.2,0.4,0.6,0.8,1],yt:[0,0.1,0.2,0.3],xl:'θ*ML = n_h / 10',id:'a'});
 let a='';w.forEach((p,k)=>{const x=k/n10;a+=`<rect x="${A.X(x-0.035)}" y="${A.Y(p)}" width="${A.X(0.035)-A.X(-0.035)}" height="${A.Y(0)-A.Y(p)}" fill="${C(3)}" opacity=".85"/>`});
 const av=vline(A,q0,'var(--warning)','θ₀ = 0,3');
 const pa=h10+2,pb=n10-h10+2,pm=pa/(pa+pb);
 const B=frame(370,200,{x0:0,x1:1,y0:0,y1:3.5,xt:[0,0.2,0.4,0.6,0.8,1],yt:[0,1,2,3],xl:'θ',id:'b'});
 let b=`<path d="${path(B,x=>beta(x,2,2),0.001,0.999)}" fill="none" stroke="${C(2)}" stroke-width="1.8" opacity=".6"/>`;
 b+=`<path d="${path(B,x=>beta(x,pa,pb),0.001,0.999)}" fill="none" stroke="${C(1)}" stroke-width="2.6"/>`;
 const bv=vline(B,h10/n10,'var(--warning)','θ*ML = 0,3',-4,'end')+vline(B,pm,C(1),`E(θ | D) = ${f(pm,3)}`);
 $('fig').innerHTML=`<div class="row">
 <div><div class="ttl">а) Классика: θ₀ фиксирован, случайны данные</div>${svg(A,a,av)}
  <div class="note">Распределение оценки по всем возможным сериям из ${n10} бросков при θ₀ = ${f(q0,1)}. E θ*ML = ${f(E,2)}, E(θ*ML − θ₀)² = ${f(MSE,3)}.</div></div>
 <div><div class="ttl">б) Байес: данные D₁₀ фиксированы, случаен θ</div>${svg(B,b,bv)}
  <div class="lg"><span><i class="sw" style="background:${C(2)};opacity:.6"></i>априорное Beta(2, 2)</span><span><i class="sw" style="background:${C(1)}"></i>апостериорное Beta(${pa}, ${pb})</span></div>
  <div class="note">Одна наблюдённая серия D₁₀: ${h10} «головы» из ${n10}.</div></div></div>`;
}

// ---------- Fig 3.1: KL divergence between the negative binomial and Poisson(4) ----------
if(mode==='kl'){
 const P=KS.map(k=>Math.exp(lnb(k))),Q=KS.map(k=>Math.exp(lpois(k,4)));
 const kl=(A,B)=>A.reduce((s,p,k)=>p>0?s+p*Math.log(p/B[k]):s,0);
 const D=KS.map(k=>P[k]*Math.log(P[k]/Q[k])),KM=15;
 const A=frame(440,170,{x0:-0.6,x1:KM-0.4,y0:0,y1:0.21,xt:[...Array(KM).keys()],yt:[0,0.1,0.2],L:44,B:22,id:'a'});
 let a='';for(let k=0;k<KM;k++){a+=`<rect x="${A.X(k-0.38)}" y="${A.Y(P[k])}" width="${A.X(0)-A.X(-0.36)}" height="${A.Y(0)-A.Y(P[k])}" fill="${C(1)}"/>`;
  a+=`<rect x="${A.X(k+0.02)}" y="${A.Y(Q[k])}" width="${A.X(0)-A.X(-0.36)}" height="${A.Y(0)-A.Y(Q[k])}" fill="${C(2)}"/>`}
 const B=frame(440,150,{x0:-0.6,x1:KM-0.4,y0:-0.08,y1:0.22,xt:[...Array(KM).keys()],yt:[-0.05,0,0.1,0.2],xl:'k',L:44,id:'b'});
 let b='';for(let k=0;k<KM;k++){const v=D[k];b+=`<rect x="${B.X(k-0.36)}" y="${B.Y(Math.max(v,0))}" width="${B.X(0)-B.X(-0.72)}" height="${Math.abs(B.Y(0)-B.Y(v))}" fill="${v>=0?C(1):'var(--muted-foreground)'}" opacity="${v>=0?.85:.55}"/>`}
 const tail=D.slice(KM).reduce((s,v)=>s+v,0);
 $('fig').innerHTML=`<div class="g"><div>
  <div class="ttl" style="font-weight:500;font-size:12.5px;color:var(--muted-foreground)">вероятности P(k) и Q(k)</div>${svg(A,a)}
  <div class="ttl" style="font-weight:500;font-size:12.5px;color:var(--muted-foreground);margin-top:6px">вклад P(k) · log(P(k) / Q(k))</div>${svg(B,b)}
  <div class="lg"><span><i class="sw" style="background:${C(1)}"></i>P = NB: среднее 4, дисперсия 12</span><span><i class="sw" style="background:${C(2)}"></i>Q = Pois(4): среднее 4, дисперсия 4</span></div></div>
 <div class="side" style="max-width:260px"><b>D_KL(P‖Q) = ${f(kl(P,Q),3)}</b> — сумма всех столбиков снизу (хвост k ≥ ${KM} даёт ещё ${f(tail,3)}).<br><br>
  Больше всего дают k = 0 и 1: там P = ${f(P[0],3)} и ${f(P[1],3)}, а Q всего ${f(Q[0],3)} и ${f(Q[1],3)}. Отрицательные вклады при k = 3–7, где Q &gt; P, сумму не перевешивают.<br><br>
  <b>D_KL(Q‖P) = ${f(kl(Q,P),3)}</b>: дивергенция в обратную сторону другая.</div></div>`;
}

// ---------- Fig 4.1: the ML criterion converges to the KL divergence ----------
if(mode==='consistency'){
 const NS=[10,100,10000],cols=[C(2),C(3),C(1)];
 const panel=(title,lp,seed,id)=>{
  const x=sample(lp,NS[NS.length-1],seed);
  const F=frame(370,230,{x0:2,x1:7,y0:-0.1,y1:1.4,xt:[2,3,4,5,6,7],yt:[0,0.5,1],xl:'λ',id});
  let s='',over='',lg='';
  NS.forEach((n,i)=>{const xs=x.slice(0,n),m=xs.reduce((a,b)=>a+b,0)/n,c0=xs.reduce((a,k)=>a+lp(k)+lfact(k),0)/n;
   const crit=l=>c0-(m*Math.log(l)-l);           // (1/n) Σ [log p*(x_i) − log Pois(x_i; λ)]
   s+=`<path d="${path(F,crit,2,7)}" fill="none" stroke="${cols[i]}" stroke-width="${1.4+i*0.5}"/>`;
   over+=`<circle cx="${F.X(m)}" cy="${F.Y(crit(m))}" r="3.2" fill="${cols[i]}"/>`;
   lg+=`<span><i class="sw" style="background:${cols[i]}"></i>n = ${n}: λ*ML = x̄ = ${f(m,n>1000?3:2)}</span>`});
  const KL=l=>KS.reduce((a,k)=>{const p=Math.exp(lp(k));return p>0?a+p*(lp(k)-lpois(k,l)):a},0);
  const mean=KS.reduce((a,k)=>a+k*Math.exp(lp(k)),0);
  s+=`<path d="${path(F,KL,2,7,120)}" fill="none" stroke="var(--foreground)" stroke-width="1.6" stroke-dasharray="5 3"/>`;
  over+=`<circle cx="${F.X(mean)}" cy="${F.Y(KL(mean))}" r="3.6" fill="none" stroke="var(--foreground)" stroke-width="1.6"/>`;
  lg+=`<span><i class="sw" style="background:var(--foreground)"></i>предел: D_KL(p*‖Pois(λ)), min ${f(KL(mean),3)} при λ* = ${f(mean,0)}</span>`;
  return `<div><div class="ttl">${title}</div>${svg(F,s,over)}<div class="lg">${lg}</div></div>`};
 $('fig').innerHTML=`<div class="row">${panel('а) p* = Pois(4): истина в модели',k=>lpois(k,4),23,'a')}${panel('б) p* = NB (среднее 4, дисп. 12): истина вне модели',lnb,30,'b')}</div>`;
}

// ---------- Fig 4.2: KL projection onto the model Bin(2, q) on the simplex of three outcomes ----------
if(mode==='simplex'){
 const ps=[0.5,0.1,0.4],qs=(ps[1]+2*ps[2])/2,bn=q=>[(1-q)**2,2*q*(1-q),q*q];
 const KLq=q=>{const b=bn(q);return ps.reduce((a,p,i)=>a+p*Math.log(p/b[i]),0)};
 const W=400,H=330,V=[[40,300],[360,300],[200,300-320*Math.sqrt(3)/2]]; // vertices: k = 0, k = 2, k = 1
 const P=p=>[p[0]*V[0][0]+p[2]*V[1][0]+p[1]*V[2][0],p[0]*V[0][1]+p[2]*V[1][1]+p[1]*V[2][1]];
 let s=`<polygon points="${V.map(v=>v.join(',')).join(' ')}" fill="none" stroke="var(--border)" stroke-width="1.5"/>`;
 s+=`<text x="${V[0][0]}" y="${V[0][1]+16}" text-anchor="middle">k = 0</text><text x="${V[1][0]}" y="${V[1][1]+16}" text-anchor="middle">k = 2</text><text x="${V[2][0]}" y="${V[2][1]-6}" text-anchor="middle">k = 1</text>`;
 let d='';for(let i=0;i<=200;i++){const [x,y]=P(bn(i/200));d+=(i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)}
 s+=`<path d="${d}" fill="none" stroke="${C(2)}" stroke-width="2.4"/>`;
 [0.2,0.8].forEach(q=>{const [x,y]=P(bn(q));s+=`<circle cx="${x}" cy="${y}" r="2.2" fill="${C(2)}"/><text x="${q<0.5?x-12:x+12}" y="${y-8}" text-anchor="${q<0.5?'end':'start'}" fill="${C(2)}">q = ${f(q,1)}</text>`});
 const [a,b]=P(ps),[c,e]=P(bn(qs));
 s+=`<line x1="${a}" y1="${b}" x2="${c}" y2="${e}" stroke="var(--foreground)" stroke-dasharray="4 3"/>`;
 s+=`<circle cx="${a}" cy="${b}" r="5" fill="var(--warning)"/><text x="${a+9}" y="${b+4}" fill="var(--warning)" font-weight="600">p*</text>`;
 s+=`<circle cx="${c}" cy="${e}" r="5" fill="${C(1)}"/><text x="${c}" y="${e-10}" text-anchor="middle" fill="${C(1)}" font-weight="600">p(· | q*)</text>`;
 let best=0.5,bv=1e9;for(let q=0.001;q<1;q+=0.001){const v=KLq(q);if(v<bv){bv=v;best=q}}
 $('fig').innerHTML=`<div class="g"><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${s}</svg>
 <div class="side" style="max-width:300px"><b>Пространство распределений</b> числа «голов» k в двух бросках: точка треугольника — тройка (P(0), P(1), P(2)), вершина — распределение, сосредоточенное в одном k.<br><br>
 <b>Модель</b> Bin(2, q) — кривая ((1−q)², 2q(1−q), q²).<br><br>
 <b>Истина</b> p* = (${ps.map(v=>f(v,1)).join('; ')}) лежит вне кривой: «0 или 2 головы» встречаются чаще, чем допускает любое q.<br><br>
 <b>ОМП</b> сходится к q* = E k / 2 = ${f(qs,2)}: это минимум D_KL(p*‖Bin(2, q)) = ${f(KLq(qs),3)} (перебор по сетке даёт ${f(best,3)}).</div></div>`;
}

// ---------- Fig 5.1: Bernstein–von Mises on the thumbtack ----------
if(mode==='bvm'){
 const panel=(n,h,id,ymax,yt)=>{
  const a=h+2,b=n-h+2,qh=h/n,v=qh*(1-qh)/n,m=a/(a+b),sd=Math.sqrt(a*b/((a+b)**2*(a+b+1)));
  const F=frame(370,200,{x0:0,x1:1,y0:0,y1:ymax,xt:[0,0.2,0.4,0.6,0.8,1],yt,xl:'θ',id});
  let s=`<path d="${path(F,x=>beta(x,2,2),0.001,0.999)}" fill="none" stroke="${C(2)}" stroke-width="1.6" opacity=".55"/>`;
  s+=`<path d="${path(F,x=>beta(x,a,b),0.001,0.999,400)}" fill="none" stroke="${C(1)}" stroke-width="2.6"/>`;
  s+=`<path d="${path(F,x=>N(x,qh,v),0,1,400)}" fill="none" stroke="var(--foreground)" stroke-width="1.6" stroke-dasharray="5 3"/>`;
  const good=Math.abs(m-qh)<0.25*sd&&Math.abs(sd/Math.sqrt(v)-1)<0.05;
  return `<div><div class="ttl">n = ${n}, «голов» ${h}</div>${svg(F,s)}
   <div class="lg"><span><i class="sw" style="background:${C(1)}"></i>Beta(${a}, ${b}): среднее ${f(m,3)}, с. о. ${f(sd,3)}</span><span><i class="sw" style="background:var(--foreground)"></i>N(${f(qh,1)}; ${f(v,4)}): с. о. ${f(Math.sqrt(v),3)}</span></div>
   <div class="note"><span class="${good?'ok':'no'}">${good?'✓':'✗'}</span> ${good?'Кривые почти совпадают: априорное забыто.':'Сдвиг среднего и ширина ещё заметны: априорное Beta(2, 2) тянет к 0,5.'}</div></div>`};
 $('fig').innerHTML=`<div class="row">${panel(n10,h10,'a',4,[0,1,2,3,4])}${panel(100,30,'b',10,[0,5,10])}</div>
  <div class="lg"><span><i class="sw" style="background:${C(2)};opacity:.55"></i>априорное Beta(2, 2) (оси y у панелей разные)</span></div>`;
}
</script>
