<style>
.g{display:grid;grid-template-columns:auto 1fr;column-gap:28px;font-family:var(--font-sans);align-items:start}
.t{font-size:14px;font-weight:600;color:var(--foreground);margin:0 0 8px}
.r{display:flex;align-items:center;gap:10px;margin:6px 0}
.l{width:70px;text-align:right;font-size:12px;color:var(--muted-foreground)}
.s{display:flex;gap:3px;font-family:var(--font-mono);font-size:12px}
.s span{box-sizing:border-box;width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:4px;color:var(--background);font-weight:600}
.c1{background:var(--chart-1)}.c2{background:var(--chart-2)}.c3{background:var(--chart-3)}
.cnt{display:flex;gap:8px;font:13px var(--font-mono)}
.cnt span{padding:3px 8px;border-radius:4px;color:var(--background);font-weight:600}
.m{color:var(--muted-foreground);font-size:12px}
.side{font-size:13px;line-height:1.55;color:var(--muted-foreground);border-left:2px solid var(--border);padding-left:14px}
.side b{color:var(--foreground)}
</style>
<div class="g"><div><div class="t">10 случаев → счётчики по тяжести</div><div id="f"></div></div><div class="side" id="n"></div></div>
<script>
const seq=[1,1,2,1,1,3,1,2,1,1],names=['лёгкая','средняя','тяжёлая'],p=[0.7,0.2,0.1];
const cnt=[1,2,3].map(c=>seq.filter(x=>x==c).length);
const fact=n=>n<=1?1:n*fact(n-1),coef=fact(10)/cnt.reduce((a,k)=>a*fact(k),1),pr=coef*cnt.reduce((a,k,i)=>a*p[i]**k,1);
const f=(x,d)=>x.toFixed(d).replace('.',',');
let h=`<div class="r"><div class="l">случаи</div><div class="s">${seq.map(c=>`<span class="c${c}">${c}</span>`).join('')}</div></div>`;
h+=`<div class="r"><div class="l">Mult</div><div class="cnt">${cnt.map((k,i)=>`<span class="c${i+1}">X${'₁₂₃'[i]} = ${k}</span>`).join('')}</div></div>`;
const merged=seq.map(c=>c==1?1:0);
h+=`<div class="r"><div class="l">Bin для X₁</div><div class="s">${merged.map(c=>`<span class="${c?'c1':''}" style="${c?'':'background:var(--muted);color:var(--muted-foreground)'}">${c}</span>`).join('')}</div><span class="m">«лёгкая» против «не лёгкая»: X₁ = ${cnt[0]}</span></div>`;
document.getElementById('f').innerHTML=h;
document.getElementById('n').innerHTML=`Категории: <b>1</b> ${names[0]} (${f(p[0],1)}), <b>2</b> ${names[1]} (${f(p[1],1)}), <b>3</b> ${names[2]} (${f(p[2],1)}).<br><br>Вероятность счётчиков (${cnt.join(', ')}) = ${coef} строк × ${f(p[0],1)}<sup>${cnt[0]}</sup>·${f(p[1],1)}<sup>${cnt[1]}</sup>·${f(p[2],1)}<sup>${cnt[2]}</sup> ≈ <b>${f(pr,3)}</b>.<br><br>Нижняя строка: объединили «средняя» и «тяжёлая» в «не лёгкая» — осталась схема Бернулли.`;
</script>
