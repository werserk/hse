<style>
.w{font-family:var(--font-sans)}
.top{display:flex;align-items:center;gap:6px;margin:0 0 10px}
.top button{font:13px var(--font-sans);height:28px;padding:0 10px;border:1px solid var(--border);border-radius:var(--radius);background:var(--card);color:var(--foreground);cursor:pointer}
.top button:disabled{opacity:.35;cursor:default}
.top span{font-size:12px;color:var(--muted-foreground);margin-left:6px}
.g{display:grid;grid-template-columns:auto 1fr;column-gap:24px;align-items:start}
svg text{font-family:var(--font-sans);font-size:11px;fill:var(--muted-foreground)}
svg text.k{fill:var(--foreground);font-weight:600}
.ax{stroke:var(--border)}
#steps{max-width:280px;min-height:330px}
.txt{padding:9px 6px 9px 0;border-top:1px solid var(--border);font-size:13px;line-height:1.5;color:var(--subtle-foreground);cursor:pointer;display:grid;grid-template-columns:22px 1fr;gap:8px}
.txt:first-child{border-top:0;padding-top:0}
.txt .n{width:20px;height:20px;border-radius:50%;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px}
.txt b{display:block;color:inherit}
.txt .d{display:none}
.txt.done{color:var(--muted-foreground)}
.txt.on{color:var(--foreground)}
.txt.on .d{display:block}
.txt.on .n{background:var(--brand);border-color:var(--brand);color:var(--background)}
.txt.on b{color:var(--brand)}
</style>
<div class="w">
<div class="top"><button id="prev">◀ назад</button><button id="next">дальше ▶</button><span id="cnt"></span></div>
<div class="g"><svg id="s"></svg><div id="steps"></div></div>
</div>
<script>
// simulated data (calc_b.py, seed 7): true cases N_i ~ Pois(10 e^{0.1(i-1)}), each reported after a Gamma(5.48, rate 0.77) delay;
// O_i = cases of day i already in the statistics on day t = 30
const Ntrue=[13,9,16,11,12,16,14,22,22,26,27,33,31,43,36,45,52,43,61,63,56,77,100,103,116,120,131,185,171,200];
const O=[13,9,16,11,12,16,14,22,22,26,27,33,31,43,35,44,50,39,57,53,39,45,59,40,36,15,4,1,0,0];
const t=O.length,sh=5.48,rt=0.77,pmin=0.05;
function lg(x){const c=[76.18009172947146,-86.50532032941677,24.01409824083091,-1.231739572450155,0.1208650973866179e-2,-0.5395239384953e-5];let y=x,s0=x+5.5;s0-=(x+0.5)*Math.log(s0);let s=1.000000000190015;for(const q of c)s+=q/++y;return -s0+Math.log(2.5066282746310005*s/x)}
const pdf=x=>x<=0?0:Math.exp(sh*Math.log(rt)+(sh-1)*Math.log(x)-rt*x-lg(sh));
const cdf=x=>{let s=0,h=0.001;for(let u=h/2;u<x;u+=h)s+=pdf(u)*h;return s};
const pk=Array.from({length:t},(_,k)=>cdf(k));               // p_k = F_G(k)
// Y ~ NB(r = O+1, p): pmf recursion P(y+1) = P(y)(y+r)(1-p)/(y+1); quantile = smallest y with CDF >= q
function nbq(r,p,q){let y=0,P=Math.pow(p,r),C=P;while(C<q){P*=(y+r)*(1-p)/(y+1);y++;C+=P}return y}
const est=O.map((o,i)=>{const k=t-1-i,p=pk[k];if(p<pmin)return null;const r=o+1;
 return{k,p,m:o+r*(1-p)/p,lo:o+nbq(r,p,0.05),hi:o+nbq(r,p,0.95)}});
const fr=(x,d)=>x.toFixed(d).replace('.',',');
const W=470,L=36,R=34,T0=24,B0=250,Hs=B0+46,X=i=>L+(W-L-R)*(i-0.5)/t,ymax=200,Y=v=>B0-(B0-T0)*Math.min(v,ymax)/ymax,Yp=p=>B0-(B0-T0)*p;
const d25=est[24],d27=est[26];
const S=[
 {t:'Что видно на день t',st:{},d:`Столбцы — случаи каждого дня, уже попавшие в статистику к дню t = ${t}. Последние дни выглядят как спад, хотя эпидемия растёт: их случаи ещё не дошли до учёта.`},
 {t:'Доля уже учтённых',st:{p:1},d:`Задержка от симптомов до учёта ~ Gamma(5,48; интенсивность 0,77), в среднем ${fr(sh/rt,1)} дня. День t − k учтён с вероятностью p<sub>k</sub> = F<sub>G</sub>(k): k = 5 — ${fr(pk[5],2)}, k = 3 — ${fr(pk[3],3)}, k = 0 — 0.`},
 {t:'Поправка NB',st:{p:1,e:1},d:`Неучтённые Y ~ NB(O + 1, p<sub>k</sub>). Точка — O + E[Y], отрезок — 90% интервал. День 25: O = ${O[24]}, p<sub>5</sub> = ${fr(d25.p,2)} → ${fr(d25.m,0)} [${d25.lo}; ${d25.hi}]. Дни с p<sub>k</sub> < ${fr(pmin,2)} не оцениваем: интервал шире самой величины.`},
 {t:'Сверка с правдой',st:{p:1,e:1,n:1},d:`Данные смоделированы, поэтому истинные числа известны (контуры). Поправка возвращает рост; чем меньше p<sub>k</sub>, тем шире интервал: день 27 (k = 3) — [${d27.lo}; ${d27.hi}] при правде ${Ntrue[26]}.`}];
let k=0;window.stepperBusy=false;const $=id=>document.getElementById(id);
function fig(){
 const st=S[k].st;let s='';
 s+=`<line class="ax" x1="${L}" y1="${B0}" x2="${W-R}" y2="${B0}"/><line class="ax" x1="${L}" y1="${T0}" x2="${L}" y2="${B0}"/>`;
 [0,50,100,150,200].forEach(v=>s+=`<text x="${L-4}" y="${Y(v)+4}" text-anchor="end">${v}</text>`);
 [1,5,10,15,20,25,30].forEach(v=>s+=`<text x="${X(v)}" y="${B0+14}" text-anchor="middle">${v}</text>`);
 s+=`<text x="${W-R}" y="${B0+28}" text-anchor="end">день заболевания i</text><text x="${L}" y="${T0-10}">случаев</text>`;
 const bw=X(2)-X(1)-3;
 O.forEach((o,i)=>s+=`<rect x="${X(i+1)-bw/2}" y="${Y(o)}" width="${bw}" height="${B0-Y(o)}" fill="color-mix(in srgb,var(--chart-6) 55%,transparent)"/>`);
 if(st.n)Ntrue.forEach((n,i)=>s+=`<rect x="${X(i+1)-bw/2}" y="${Y(n)}" width="${bw}" height="${B0-Y(n)}" fill="none" stroke="var(--chart-3)" stroke-width="1.4"/>`);
 if(st.p){
  s+=`<line class="ax" x1="${W-R}" y1="${T0}" x2="${W-R}" y2="${B0}"/>`;
  [0,0.5,1].forEach(v=>s+=`<text x="${W-R+4}" y="${Yp(v)+4}" style="fill:var(--chart-5)">${fr(v,1)}</text>`);
  s+=`<text class="k" x="${X(9)}" y="${Yp(1)-6}" style="fill:var(--chart-5)">p<tspan baseline-shift="sub" font-size="8">k</tspan> = F<tspan baseline-shift="sub" font-size="8">G</tspan>(k)</text>`;
  s+=`<path d="${O.map((_,i)=>(i?'L':'M')+X(i+1).toFixed(1)+' '+Yp(pk[t-1-i]).toFixed(1)).join('')}" fill="none" stroke="var(--chart-5)" stroke-width="1.8" stroke-dasharray="5 3"/>`;
  [0,3,5,10].forEach(kk=>s+=`<text x="${X(t-kk)}" y="${B0+40}" text-anchor="middle" style="fill:var(--chart-5)">k=${kk}</text>`);
 }
 if(st.e){
  est.forEach((e,i)=>{if(!e)return;const x=X(i+1);
   s+=`<line x1="${x}" y1="${Y(e.lo)}" x2="${x}" y2="${Y(e.hi)}" stroke="var(--chart-1)" stroke-width="1.6"/><line x1="${x-3}" y1="${Y(e.hi)}" x2="${x+3}" y2="${Y(e.hi)}" stroke="var(--chart-1)" stroke-width="1.6"/><line x1="${x-3}" y1="${Y(e.lo)}" x2="${x+3}" y2="${Y(e.lo)}" stroke="var(--chart-1)" stroke-width="1.6"/><circle cx="${x}" cy="${Y(e.m)}" r="3" fill="var(--chart-1)"/>`});
  s+=`<rect x="${X(28)-bw/2-2}" y="${T0-4}" width="${X(30)-X(28)+bw+4}" height="${B0-T0+4}" fill="color-mix(in srgb,var(--muted-foreground) 10%,transparent)"/><text x="${X(30)+bw/2+2}" y="${T0-10}" text-anchor="end">не оцениваем</text>`;
 }
 return s;
}
function draw(){
 const el=$('s');el.setAttribute('width',W);el.setAttribute('height',Hs);el.setAttribute('viewBox',`0 0 ${W} ${Hs}`);el.innerHTML=fig();
 $('steps').innerHTML=S.map((s,i)=>`<div class="txt ${i==k?'on':i<k?'done':''}" data-i="${i}"><span class="n">${i+1}</span><span><b>${s.t}</b><span class="d">${s.d}</span></span></div>`).join('');
 $('prev').disabled=k==0;$('next').disabled=k==S.length-1;$('cnt').textContent=`шаг ${k+1} из ${S.length}`;
}
function go(i){k=Math.max(0,Math.min(S.length-1,i));draw()}
$('prev').onclick=()=>go(k-1);$('next').onclick=()=>go(k+1);
document.addEventListener('click',e=>{const t=e.target.closest('[data-i]');if(t)go(+t.dataset.i)});
draw();
</script>
