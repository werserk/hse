<style>
.w{font-family:var(--font-sans)}
.p{display:grid;grid-template-columns:1fr 1fr;column-gap:24px;max-width:700px}
.t{font-size:14px;font-weight:600;color:var(--foreground);margin:0 0 2px}
.c{font-size:13px;line-height:1.5;color:var(--muted-foreground);margin:0 0 6px;min-height:58px}
.c i{display:inline-block;width:14px;height:3px;vertical-align:3px;margin-right:5px}
svg text{font-family:var(--font-sans);font-size:11px;fill:var(--muted-foreground)}
svg text.k{fill:var(--foreground);font-weight:600}
.ax{stroke:var(--border)}
</style>
<div class="w"><div class="p" id="p"></div></div>
<script>
// gamma densities given as (shape, rate); sum of two delays = numeric convolution
function lg(x){const c=[76.18009172947146,-86.50532032941677,24.01409824083091,-1.231739572450155,0.1208650973866179e-2,-0.5395239384953e-5];let y=x,t=x+5.5;t-=(x+0.5)*Math.log(t);let s=1.000000000190015;for(const q of c)s+=q/++y;return -t+Math.log(2.5066282746310005*s/x)}
const gpdf=(a,r)=>x=>x<=0?0:Math.exp(a*Math.log(r)+(a-1)*Math.log(x)-r*x-lg(a));
const mcv=(m,cv)=>{const a=1/(cv*cv);return[a,a/m]};            // (mean, CV) -> (shape, rate)
const h=0.05,M=1600,xs=Array.from({length:M},(_,i)=>i*h);
function conv(f1,f2){const a=xs.map(f1),b=xs.map(f2),c=new Array(M).fill(0);for(let i=0;i<M;i++)for(let j=0;j<=i;j++)c[i]+=a[j]*b[i-j]*h;return c}
function stats(c){let m=0,F=[],s=0;c.forEach((v,i)=>{m+=xs[i]*v*h;s+=(i?(v+c[i-1])/2:0)*h;F.push(s)});
 const day=Array.from({length:80},(_,k)=>k==0?0:F[Math.round(k/h)]-F[Math.round((k-1)/h)]);
 let am=0;day.forEach((v,k)=>{if(v>day[am])am=k});return{m,day,am,pk:Math.max(...c)}}
const io=gpdf(1.352,0.265);                                  // incubation, slide 40 (= mean 5.1, CV 0.86)
const or=gpdf(5.48,0.77);                                    // onset -> registration, slide 40
const od=gpdf(...mcv(18.8,0.45));                            // onset -> death, slides 32-33
const ir=conv(io,or),id=conv(io,od),Sr=stats(ir),Sd=stats(id);
const fr=(x,d)=>x.toFixed(d).replace('.',',');
function panel(T,top,f1,f2,sum,S,lab){
 const W=330,H=190,L=30,R=8,T0=10,B=30,X=t=>L+(W-L-R)*t/T,Y=v=>T0+(H-T0-B)*(1-v/top);
 let s=`<line class="ax" x1="${L}" y1="${Y(0)}" x2="${W-R}" y2="${Y(0)}"/><line class="ax" x1="${L}" y1="${T0}" x2="${L}" y2="${Y(0)}"/>`;
 for(let v=0;v<=T;v+=10)s+=`<text x="${X(v)}" y="${Y(0)+14}" text-anchor="middle">${v}</text>`;
 s+=`<text x="${W-R}" y="${H-2}" text-anchor="end">дни от заражения</text>`;
 const bw=X(1)-X(0)-1;
 for(let k=1;k<=T;k++)s+=`<rect x="${X(k-1)+0.5}" y="${Y(S.day[k])}" width="${bw}" height="${Y(0)-Y(S.day[k])}" fill="color-mix(in srgb,var(--chart-1) 20%,transparent)"/>`;
 const line=(fn,c,w,d)=>{let p='';for(let i=0;i<M&&xs[i]<=T;i+=4)p+=(i?'L':'M')+X(xs[i]).toFixed(1)+' '+Y(fn(i)).toFixed(1);return`<path d="${p}" fill="none" stroke="${c}" stroke-width="${w}" ${d?'stroke-dasharray="5 3"':''}/>`};
 s+=line(i=>f1(xs[i]),'var(--chart-4)',1.8,1)+line(i=>f2(xs[i]),'var(--chart-2)',1.8,1)+line(i=>sum[i],'var(--chart-1)',2.4);
 s+=`<line x1="${X(S.m)}" y1="${Y(S.pk)-4}" x2="${X(S.m)}" y2="${Y(0)}" stroke="var(--chart-1)" stroke-dasharray="2 3"/><text class="k" x="${X(S.m)+5}" y="${Y(S.pk)-8}">${lab} ${fr(S.m,1)}</text>`;
 return`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">${s}</svg>`;
}
const sw=c=>`<i style="background:var(${c})"></i>`;
document.getElementById('p').innerHTML=
 `<div><div class="t">До регистрации случая (слайды 40–41)</div><div class="c">${sw('--chart-4')}инкубация, среднее 5,1<br>${sw('--chart-2')}симптомы → статистика, среднее ${fr(5.48/0.77,1)}<br>${sw('--chart-1')}сумма: заражение → статистика</div>${panel(40,0.16,io,or,ir,Sr,'среднее')}</div>`+
 `<div><div class="t">До смерти (слайды 32–33)</div><div class="c">${sw('--chart-4')}инкубация, среднее 5,1<br>${sw('--chart-2')}симптомы → смерть, среднее 18,8<br>${sw('--chart-1')}сумма: заражение → смерть</div>${panel(60,0.16,io,od,id,Sd,'среднее')}</div>`;
</script>
