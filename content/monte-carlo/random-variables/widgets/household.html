<style>
.w{font-family:var(--font-sans)}
.p{display:grid;grid-template-columns:1fr 1fr;column-gap:28px}
.t{font-size:14px;font-weight:600;color:var(--foreground);margin:0 0 2px}
.c{font-size:12px;color:var(--muted-foreground);margin:0 0 10px}
table{border-collapse:collapse;font-family:var(--font-mono);font-size:13px}
td,th{width:58px;height:34px;text-align:center;padding:0}
th{font:12px var(--font-mono);color:var(--muted-foreground);font-weight:400}
td.v{border:1px solid var(--background)}
td.m{color:var(--muted-foreground);font-size:12px}
td.both{outline:2px solid var(--warning);outline-offset:-2px;font-weight:700}
.st{margin-top:12px;font-size:13px;line-height:1.7;color:var(--muted-foreground)}
.st b{color:var(--foreground);font-family:var(--font-mono);font-weight:600}
</style>
<div class="w"><div class="p" id="p"></div></div>
<script>
const q=0.3,C=[{t:'Независимо',c:'таблица = произведение краевых',J:[[(1-q)*(1-q),(1-q)*q],[q*(1-q),q*q]]},{t:'Общий источник',c:'«оба» чаще, «один» реже',J:[[0.6,0.1],[0.1,0.2]]}];
const f=(x,d=2)=>(Math.abs(x)<1e-12?0:x).toFixed(d).replace('.',',');
document.getElementById('p').innerHTML=C.map(({t,c,J})=>{
 const m1=[J[0][0]+J[0][1],J[1][0]+J[1][1]],m2=[J[0][0]+J[1][0],J[0][1]+J[1][1]];
 const EXY=J[1][1],cov=EXY-m1[1]*m2[1],v1=m1[1]*(1-m1[1]),v2=m2[1]*(1-m2[1]),rho=cov/Math.sqrt(v1*v2),vs=v1+v2+2*cov;
 const cell=(i,j)=>`<td class="v ${i&&j?'both':''}" style="background:color-mix(in srgb,var(--chart-1) ${Math.round(15+75*J[i][j]/0.6)}%,transparent);color:${J[i][j]>0.4?'var(--background)':'var(--foreground)'}">${f(J[i][j])}</td>`;
 return `<div><div class="t">${t}</div><div class="c">${c}</div><table><tr><th></th><th>X₂ = 0</th><th>X₂ = 1</th><th>f<sub>X₁</sub></th></tr>
 <tr><th>X₁ = 0</th>${cell(0,0)}${cell(0,1)}<td class="m">${f(m1[0])}</td></tr><tr><th>X₁ = 1</th>${cell(1,0)}${cell(1,1)}<td class="m">${f(m1[1])}</td></tr>
 <tr><th>f<sub>X₂</sub></th><td class="m">${f(m2[0])}</td><td class="m">${f(m2[1])}</td><td></td></tr></table>
 <div class="st">E(X₁X₂) = <b>${f(EXY)}</b><br>Cov = ${f(EXY)} − ${f(m1[1],1)}·${f(m2[1],1)} = <b>${f(cov)}</b><br>ρ = <b>${f(rho)}</b><br>Var(X₁ + X₂) = <b>${f(vs)}</b></div></div>`}).join('');
</script>
