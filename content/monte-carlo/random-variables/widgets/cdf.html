<style>
.w{font-family:var(--font-sans)}
.p{display:grid;grid-template-columns:1fr 1fr;column-gap:24px}
.t{font-size:14px;font-weight:600;color:var(--foreground);margin:0 0 2px}
.c{font-size:12px;color:var(--muted-foreground);margin:0 0 6px}
svg text{font-family:var(--font-sans);font-size:11px;fill:var(--muted-foreground)}
svg text.k{fill:var(--foreground);font-weight:600}
.ax{stroke:var(--border);stroke-width:1}
.b1{fill:var(--chart-1)}
.l1{stroke:var(--chart-1);stroke-width:2.2;fill:none}
.ar{fill:color-mix(in srgb,var(--chart-1) 28%,transparent)}
.mk{stroke:var(--warning);stroke-width:1.4;stroke-dasharray:4 3;fill:none}
.dot{fill:var(--chart-1)}.odot{fill:var(--background);stroke:var(--chart-1);stroke-width:1.6}
</style>
<div class="w"><div class="p">
<div><div class="t">Дискретная: X — число заразившихся</div><div class="c">функция вероятности f<sub>X</sub> и ступенчатая F<sub>X</sub></div><svg id="d"></svg></div>
<div><div class="t">Непрерывная: T — время до случая, дни</div><div class="c">плотность f<sub>T</sub> и гладкая F<sub>T</sub></div><svg id="c"></svg></div>
</div></div>
<script>
const W=300,H=150,L=34,R=10,T=10,B=24;
const f=v=>v.toFixed(3).replace('.',',');
function frame(id,h){const s=document.getElementById(id);s.setAttribute('viewBox',`0 0 ${W} ${h}`);s.setAttribute('width',W);s.setAttribute('height',h);return s}
// discrete
const p=0.2,pm=[0,1,2,3].map(k=>[1,3,3,1][k]*p**k*(1-p)**(3-k)),cm=pm.map((_,k)=>pm.slice(0,k+1).reduce((a,b)=>a+b,0));
function panel(y0,ymax,yt,x0,xmax,xt,body,ylab){ // one chart; x0 = left end of the x axis
 const X=x=>L+(W-L-R)*(x-x0)/(xmax-x0),Y=y=>y0+H-B-(H-B-T)*y/ymax;let s=`<line class="ax" x1="${L}" y1="${Y(0)}" x2="${W-R}" y2="${Y(0)}"/><line class="ax" x1="${L}" y1="${y0+T}" x2="${L}" y2="${Y(0)}"/>`;
 yt.forEach(v=>{s+=`<text x="${L-5}" y="${Y(v)+4}" text-anchor="end">${String(v).replace('.',',')}</text>`});
 xt.forEach(v=>{s+=`<text x="${X(v)}" y="${Y(0)+15}" text-anchor="middle">${String(v).replace('.',',')}</text>`});
 s+=`<text x="${L+4}" y="${y0+T+2}" class="k">${ylab}</text>`;
 return s+body(X,Y);
}
let s=panel(0,0.6,[0,0.5],-0.5,3.6,[0,1,2,3],(X,Y)=>pm.map((q,k)=>`<rect class="b1" x="${X(k)-9}" y="${Y(q)}" width="18" height="${Y(0)-Y(q)}"/><text x="${X(k)}" y="${Y(q)-4}" text-anchor="middle">${f(q)}</text>`).join(''),'f');
s+=panel(H,1.1,[0,0.5,1],-0.5,3.6,[0,1,2,3],(X,Y)=>{let r=`<line class="l1" x1="${L}" y1="${Y(0)}" x2="${X(0)}" y2="${Y(0)}"/>`;
 cm.forEach((c,k)=>{const x2=k<3?X(k+1):X(3.6);r+=`<line class="l1" x1="${X(k)}" y1="${Y(c)}" x2="${x2}" y2="${Y(c)}"/><circle class="odot" cx="${X(k)}" cy="${Y(k?cm[k-1]:0)}" r="3.2"/><circle class="dot" cx="${X(k)}" cy="${Y(c)}" r="3.2"/>`;if(k<3)r+=`<text x="${X(k)+6}" y="${Y(c)-5}">${f(c)}</text>`});return r},'F');
const d=frame('d',2*H);d.innerHTML=s;
// continuous
const lam=4,tm=1.25,N=120;
let c=panel(0,4.4,[0,2,4],0,tm,[0,0.25,0.5,0.75,1],(X,Y)=>{let a=`M${X(0)} ${Y(0)}`,l='';for(let i=0;i<=N;i++){const t=tm*i/N;l+=(i?'L':'M')+X(t)+' '+Y(lam*Math.exp(-lam*t))}
 for(let i=0;i<=30;i++){const t=0.25*i/30;a+=`L${X(t)} ${Y(lam*Math.exp(-lam*t))}`}a+=`L${X(0.25)} ${Y(0)}Z`;
 return `<path class="ar" d="${a}"/><path class="l1" d="${l}"/><text x="${X(0.07)}" y="${Y(1.0)}" class="k" style="fill:var(--chart-1)">0,632</text><text x="${X(0)+8}" y="${Y(4)+4}">f(0) = 4</text>`},'f');
c+=panel(H,1.1,[0,0.5,1],0,tm,[0,0.25,0.5,0.75,1],(X,Y)=>{let l='';for(let i=0;i<=N;i++){const t=tm*i/N;l+=(i?'L':'M')+X(t)+' '+Y(1-Math.exp(-lam*t))}const v=1-Math.exp(-1);
 return `<path class="mk" d="M${L} ${Y(v)}H${X(0.25)}V${Y(0)}"/><path class="l1" d="${l}"/><text x="${X(0.25)+6}" y="${Y(v)+12}">F(0,25) = ${f(v)}</text>`},'F');
const cc=frame('c',2*H);cc.innerHTML=c;
</script>
