<style>
.w{font-family:var(--font-sans)}
.p{display:grid;grid-template-columns:1fr 1fr;column-gap:24px}
.t{font-size:14px;font-weight:600;color:var(--foreground);margin:0 0 2px}
.c{font-size:12px;color:var(--muted-foreground);margin:0 0 6px;min-height:34px}
svg text{font-family:var(--font-sans);font-size:11px;fill:var(--muted-foreground)}
svg text.k{fill:var(--foreground);font-weight:600}
.ax{stroke:var(--border)}
.l1{stroke:var(--chart-1);stroke-width:2.2;fill:none}
.rs{stroke:var(--chart-1);stroke-width:1;stroke-dasharray:2 3}
.u{stroke:var(--warning);stroke-width:1.8;fill:none}
.uh{fill:var(--warning)}
.dot{fill:var(--chart-1)}
</style>
<div class="w"><div class="p">
<div><div class="t">Непрерывная T: u = 0,5</div><div class="c">горизонталь от u до кривой, затем вниз: t = −ln(1−u)/4</div><svg id="a"></svg></div>
<div><div class="t">Дискретная X: u = 0,95</div><div class="c">u между ступеньками F(1) и F(2): первая x, где F(x) ≥ u, это 2</div><svg id="b"></svg></div>
</div></div>
<script>
const W=300,H=200,L=34,R=10,T=10,B=24,fm=v=>v.toFixed(3).replace('.',',');
function fr(id,xm,xt,body){const X=x=>L+(W-L-R)*x/xm,Y=y=>T+(H-T-B)*(1-y/1.08);let s=`<line class="ax" x1="${L}" y1="${Y(0)}" x2="${W-R}" y2="${Y(0)}"/><line class="ax" x1="${L}" y1="${T}" x2="${L}" y2="${Y(0)}"/>`;
 [0,0.5,1].forEach(v=>s+=`<text x="${L-5}" y="${Y(v)+4}" text-anchor="end">${String(v).replace('.',',')}</text>`);xt.forEach(v=>s+=`<text x="${X(v)}" y="${Y(0)+15}" text-anchor="middle">${String(v).replace('.',',')}</text>`);
 s+=body(X,Y);const e=document.getElementById(id);e.setAttribute('viewBox',`0 0 ${W} ${H}`);e.setAttribute('width',W);e.setAttribute('height',H);e.innerHTML=s}
const arrow=(x,y)=>`<path class="uh" d="M${x-4} ${y-7}L${x+4} ${y-7}L${x} ${y}Z"/>`;
fr('a',1.25,[0,0.25,0.5,0.75,1],(X,Y)=>{let l='';for(let i=0;i<=120;i++){const t=1.25*i/120;l+=(i?'L':'M')+X(t)+' '+Y(1-Math.exp(-4*t))}const u=0.5,t=-Math.log(1-u)/4;
 return `<path class="l1" d="${l}"/><path class="u" d="M${L} ${Y(u)}H${X(t)}V${Y(0)-1}"/>${arrow(X(t),Y(0))}<text x="${L+4}" y="${Y(u)-5}" class="k" style="fill:var(--warning)">u</text><text x="${X(t)+5}" y="${Y(0)-8}" class="k">t = ${fm(t)}</text>`});
const p=0.2,pm=[0,1,2,3].map(k=>[1,3,3,1][k]*p**k*(1-p)**(3-k)),cm=pm.map((_,k)=>pm.slice(0,k+1).reduce((a,b)=>a+b,0));
fr('b',3.6,[0,1,2,3],(X,Y)=>{let r=`<line class="l1" x1="${L}" y1="${Y(0)}" x2="${X(0)}" y2="${Y(0)}"/>`;cm.forEach((c,k)=>{r+=`<line class="rs" x1="${X(k)}" y1="${Y(k?cm[k-1]:0)}" x2="${X(k)}" y2="${Y(c)}"/><line class="l1" x1="${X(k)}" y1="${Y(c)}" x2="${k<3?X(k+1):X(3.6)}" y2="${Y(c)}"/><circle class="dot" cx="${X(k)}" cy="${Y(c)}" r="3"/>`});
 const u=0.95,x=cm.findIndex(c=>c>=u);
 return r+`<path class="u" d="M${L} ${Y(u)}H${X(x)}V${Y(0)-1}"/>${arrow(X(x),Y(0))}<text x="${L+4}" y="${Y(u)-5}" class="k" style="fill:var(--warning)">u</text><text x="${X(1)+4}" y="${Y(cm[1])+14}">F(1) = ${fm(cm[1])}</text><text x="${X(2)+4}" y="${Y(cm[2])-6}">F(2) = ${fm(cm[2])}</text><text x="${X(x)+5}" y="${Y(0)-8}" class="k">x = ${x}</text>`});
</script>
