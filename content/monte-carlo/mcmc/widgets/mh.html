<!-- Stepper, Fig 2.1: Metropolis–Hastings for the button posterior Π(θ) = θ^4 (1-θ)^8 on (0, 1).
     Symmetric proposal y ~ N(x, 0.3^2), start 0.75, seed 485 (mulberry32 + Box–Muller, same code as plots.html).
     Top: target density π = Beta(5, 9) with current point and proposal; bottom: trajectory, time runs downwards.
     Every number (ratios, uniforms, acceptance share, mean) is computed here. -->
<meta charset="utf-8">
<style>
*{box-sizing:border-box}
.w{font-family:var(--font-sans);color:var(--foreground)}
.top{display:flex;align-items:center;gap:6px;margin:0 0 14px}
.top button{font:13px var(--font-sans);height:28px;padding:0 10px;border:1px solid var(--border);border-radius:var(--radius);background:var(--card);color:var(--foreground);cursor:pointer}
.top button:disabled{opacity:.35;cursor:default}
.top span{font-size:12px;color:var(--muted-foreground);margin-left:6px}
.g{display:grid;grid-template-columns:auto 1fr;column-gap:28px;align-items:start}
.ttl{font-size:14px;font-weight:600;color:var(--foreground);margin:0 0 4px}
svg text{font-family:var(--font-sans);font-size:11px;fill:var(--muted-foreground)}
svg .ax{stroke:var(--border)}
svg .tk{font-size:10px;fill:var(--subtle-foreground)}
.txt{padding:8px 6px 8px 0;border-top:1px solid var(--border);font-size:13px;line-height:1.5;color:var(--subtle-foreground);cursor:pointer;display:grid;grid-template-columns:22px 1fr;gap:8px}
.txt:first-child{border-top:0;padding-top:0}
.txt .n{width:20px;height:20px;border-radius:50%;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px}
.txt b{display:block;color:inherit}
.txt .d{display:none}
.txt.done{color:var(--muted-foreground)}
.txt.on{color:var(--foreground)}
.txt.on .d{display:block}
.txt.on .n{background:var(--brand);border-color:var(--brand);color:var(--background)}
.txt.on b{color:var(--brand)}
.ok{color:var(--success)}.no{color:var(--destructive)}.cw{color:var(--warning)}
@media(max-width:640px){.g{grid-template-columns:1fr}}
</style>
<div class="w">
<div class="top"><button id="prev">◀ назад</button><button id="next">дальше ▶</button><span id="cnt"></span></div>
<div class="g"><div id="fig"></div><div id="steps"></div></div>
</div>
<script>
const $=id=>document.getElementById(id);
const f=(x,d=3)=>(+x.toFixed(d)).toString().replace('.',',').replace('-','−');
function rng(seed){let a=seed>>>0;return ()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function gauss(u){let s=null;return ()=>{if(s!==null){const v=s;s=null;return v}let a;do{a=u()}while(a<=1e-300);const b=u(),r=Math.sqrt(-2*Math.log(a));s=r*Math.sin(2*Math.PI*b);return r*Math.cos(2*Math.PI*b)}}
// ---- the chain
const Pi=t=>(t>0&&t<1)?t**4*(1-t)**8:0,C=6435,pi=t=>C*Pi(t); // C = 1/B(5,9)
const SEED=485,SD=.3,X0=.75,N=2000;
const u=rng(SEED),g=gauss(u),log=[];let x=X0;
for(let i=0;i<N;i++){const y=x+SD*g(),r=Pi(y)/Pi(x),v=u(),a=v<Math.min(1,r);log.push({x,y,r,v,a});if(a)x=y}
const st=[X0,...log.map(o=>o.a?o.y:o.x)]; // st[i] = θ_i
const acc=log.filter(o=>o.a).length/N,mean=st.slice(1).reduce((s,v)=>s+v,0)/N;
// ---- drawing
const W=380,L=34,R=22,H1=170,H2=170,X=t=>L+(W-L-R)*t,Y1=y=>12+(H1-12-22)*(1-y/3.4),ROWS=26,Y2=i=>H1+14+i*(H2-24)/ROWS;
const curve=[...Array(201).keys()].map(k=>k/200).map(t=>X(t).toFixed(1)+','+Y1(pi(t)).toFixed(1)).join(' ');
function hist(){const nb=25,h=new Array(nb).fill(0);for(const v of st.slice(1))h[Math.min(nb-1,Math.floor(v*nb))]++;
 return h.map((c,k)=>{const d=c/N*nb;return `<rect x="${X(k/nb)+.5}" y="${Y1(d)}" width="${(W-L-R)/nb-1}" height="${Y1(0)-Y1(d)}" fill="color-mix(in srgb,var(--chart-1) 35%,transparent)"/>`}).join('')}
function fig(s){
 let o=`<line class="ax" x1="${L}" y1="${Y1(0)}" x2="${W-R}" y2="${Y1(0)}"/>`;
 for(const t of [0,.25,.5,.75,1])o+=`<text class="tk" x="${X(t)}" y="${Y1(0)+13}" text-anchor="middle">${f(t,2)}</text>`;
 o+=`<text x="${W-R+6}" y="${Y1(0)+4}">θ</text>`;
 if(s.hist)o+=hist();
 o+=`<polyline fill="none" stroke="var(--warning)" stroke-width="1.8" points="${curve}"/><text x="${X(.15)-4}" y="${Y1(pi(.15))-4}" text-anchor="end" style="fill:var(--warning)">π(θ)</text>`;
 // trajectory: row i holds θ_i
 const rows=Math.min(s.rows,ROWS-1);
 o+=`<text x="${L-6}" y="${Y2(0)+4}" text-anchor="end" class="tk">i = 0</text>`;
 if(rows>=5)o+=`<text x="${L-6}" y="${Y2(rows)+4}" text-anchor="end" class="tk">${rows}</text>`;
 for(let i=0;i<rows;i++){const e=log[i];
  if(e.a)o+=`<line x1="${X(e.x)}" y1="${Y2(i)}" x2="${X(e.y)}" y2="${Y2(i+1)}" stroke="var(--success)" stroke-width="1.4"/>`;
  else{o+=`<line x1="${X(e.x)}" y1="${Y2(i)}" x2="${X(e.x)}" y2="${Y2(i+1)}" stroke="var(--chart-1)" stroke-width="1.4"/>`;
   if(e.y>0&&e.y<1)o+=`<text x="${X(e.y)}" y="${Y2(i+1)+4}" text-anchor="middle" style="fill:var(--destructive);font-size:12px">×</text>`}}
 for(let i=0;i<=rows;i++)o+=`<circle cx="${X(st[i])}" cy="${Y2(i)}" r="${i==s.cur?4:2.6}" fill="var(--chart-1)"/>`;
 // current proposal on the curve
 if(s.prop!==undefined){const e=log[s.prop];
  o+=`<line x1="${X(e.x)}" y1="${Y1(0)}" x2="${X(e.x)}" y2="${Y1(pi(e.x))}" stroke="var(--chart-1)" stroke-width="2"/><circle cx="${X(e.x)}" cy="${Y1(pi(e.x))}" r="4" fill="var(--chart-1)"/><text x="${X(e.x)}" y="${Y1(pi(e.x))-8}" text-anchor="middle" style="fill:var(--chart-1)">x</text>`;
  const col=e.a?'var(--success)':'var(--destructive)';
  o+=`<line x1="${X(e.y)}" y1="${Y1(0)}" x2="${X(e.y)}" y2="${Y1(pi(e.y))}" stroke="${col}" stroke-width="2" stroke-dasharray="4 3"/><circle cx="${X(e.y)}" cy="${Y1(pi(e.y))}" r="4" fill="var(--card)" stroke="${col}" stroke-width="2"/><text x="${X(e.y)}" y="${Y1(pi(e.y))-8}" text-anchor="middle" style="fill:${col}">y</text>`}
 else if(!s.hist)o+=`<circle cx="${X(X0)}" cy="${Y1(pi(X0))}" r="4" fill="var(--chart-1)"/><line x1="${X(X0)}" y1="${Y1(0)}" x2="${X(X0)}" y2="${Y1(pi(X0))}" stroke="var(--chart-1)" stroke-width="2"/>`;
 return `<div class="ttl">${s.hist?'Гистограмма '+N+' значений θ<sub>i</sub> и π(θ)':'Цель π(θ) и шаги цепи'}</div><svg width="${W}" height="${H1+H2}" viewBox="0 0 ${W} ${H1+H2}">${o}</svg>`}
const e=log.slice(0,3),R3=k=>f(e[k].r,k?3:1),U=k=>f(e[k].v,3);
const S=[
 {t:'Цель и старт',rows:0,d:`Кривая — π(θ) = c·θ⁴(1 − θ)⁸. Алгоритм вычисляет только Π(θ) = θ⁴(1 − θ)⁸, без c. Старт x₀ = ${f(X0,2)}, далеко в хвосте. Внизу будет траектория: строка i — значение θ<sub>i</sub>, время идёт вниз.`},
 {t:'Шаг 1: вверх по π',rows:1,prop:0,cur:1,d:`Предложение y = x + 0,3·ξ, ξ ~ 𝒩(0, 1): y = ${f(e[0].y,3)}. Предложение симметрично, поэтому A = min{1, Π(y)/Π(x)}. Π(y)/Π(x) = ${R3(0)} ≥ 1: <span class="ok">принимаем всегда</span>, θ₁ = ${f(e[0].y,3)}.`},
 {t:'Шаг 2: вниз, принято',rows:2,prop:1,cur:2,d:`y = ${f(e[1].y,3)}, Π(y)/Π(x) = ${R3(1)} < 1. Разыгрываем u ~ U(0, 1): u = ${U(1)} < ${R3(1)}, <span class="ok">принимаем</span>: θ₂ = ${f(e[1].y,3)}.`},
 {t:'Шаг 3: вниз, отказ',rows:3,prop:2,cur:3,d:`y = ${f(e[2].y,3)}, Π(y)/Π(x) = ${R3(2)}. u = ${U(2)} > ${R3(2)}: <span class="no">отказ</span>, цепь остаётся на месте: θ₃ = θ₂ = ${f(e[2].x,3)}. Повтор значения — часть выборки, его нельзя выбросить.`},
 {t:'Ещё 22 шага',rows:25,cur:25,d:`<span class="ok">Зелёные</span> отрезки — принятые шаги, <span class="no">×</span> — отклонённые предложения (вне (0, 1) предложение отклоняется сразу: Π = 0). За 25 шагов принято ${log.slice(0,25).filter(o=>o.a).length}.`},
 {t:'2000 шагов',rows:25,hist:true,d:`Гистограмма всех ${N} значений θ₁…θ<sub>${N}</sub> повторяет π. Принято ${f(acc*100,1)}% предложений. Среднее θ по цепи ${f(mean,4)} при точном 5/14 ≈ 0,3571.`}];
let k=0;window.stepperBusy=false;
function draw(){
 $('fig').innerHTML=fig(S[k]);
 $('steps').innerHTML=S.map((s,i)=>`<div class="txt ${i==k?'on':i<k?'done':''}" data-i="${i}"><span class="n">${i+1}</span><span><b>${s.t}</b><span class="d">${s.d}</span></span></div>`).join('');
 $('prev').disabled=k==0;$('next').disabled=k==S.length-1;$('cnt').textContent=`шаг ${k+1} из ${S.length}`;
}
function go(i){k=Math.max(0,Math.min(S.length-1,i));draw()}
$('prev').onclick=()=>go(k-1);$('next').onclick=()=>go(k+1);
document.addEventListener('click',e=>{const t=e.target.closest('[data-i]');if(t)go(+t.dataset.i)});
let hmax=0;for(k=0;k<S.length;k++){draw();hmax=Math.max(hmax,$('steps').offsetHeight)}
k=0;$('steps').style.minHeight=hmax+'px';draw();
</script>
<script>/*fit-width*/(function(){var d=document.documentElement;function f(){d.style.zoom="";var w=d.clientWidth,s=d.scrollWidth;if(s>w+1)d.style.zoom=Math.max(.5,w/s)}addEventListener("load",f);addEventListener("resize",f);addEventListener("click",function(){setTimeout(f,60)});setTimeout(f,200)})()</script>
