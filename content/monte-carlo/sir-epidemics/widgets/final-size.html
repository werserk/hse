<style>
.g{display:grid;grid-template-columns:auto 1fr;column-gap:28px;font-family:var(--font-sans);align-items:start}
svg text{font-family:var(--font-sans);font-size:11px;fill:var(--muted-foreground)}
svg text.k{fill:var(--foreground);font-weight:600}
.ax{stroke:var(--border)}
.side{font-size:13px;line-height:1.55;color:var(--muted-foreground);border-left:2px solid var(--border);padding-left:14px}
.side b{color:var(--foreground)}
.sw{display:inline-block;width:14px;height:3px;vertical-align:3px;margin-right:6px}
</style>
<div class="g"><svg id="s"></svg><div class="side" id="side"></div></div>
<script>
// final size z solves z = 1 - exp(-r0 z): fixed-point iteration from z = 1
const fz=r=>{if(r<=1)return 0;let z=1;for(let i=0;i<2000;i++)z=1-Math.exp(-r*z);return z};
const hit=r=>r<=1?0:1-1/r;
const W=380,H=250,L=40,R=12,T=12,B=30,X=r=>L+(W-L-R)*(r-0.5)/4.5,Y=v=>H-B-(H-B-T)*v;
let s=`<line class="ax" x1="${L}" y1="${Y(0)}" x2="${W-R}" y2="${Y(0)}"/><line class="ax" x1="${L}" y1="${T}" x2="${L}" y2="${Y(0)}"/>`;
[0,0.25,0.5,0.75,1].forEach(v=>s+=`<text x="${L-5}" y="${Y(v)+4}" text-anchor="end">${String(v).replace('.',',')}</text>`);
[1,2,3,4,5].forEach(v=>s+=`<text x="${X(v)}" y="${Y(0)+15}" text-anchor="middle">${v}</text>`);
s+=`<text x="${W-R}" y="${H-2}" text-anchor="end">r₀</text>`;
const rs=Array.from({length:451},(_,i)=>0.5+i*0.01);
// overshoot band between the two curves
s+=`<path d="M${rs.map(r=>X(r)+' '+Y(fz(r))).join('L')}L${rs.slice().reverse().map(r=>X(r)+' '+Y(hit(r))).join('L')}Z" fill="color-mix(in srgb,var(--chart-1) 14%,transparent)"/>`;
s+=`<path d="M${rs.map(r=>X(r)+' '+Y(fz(r))).join('L')}" fill="none" stroke="var(--chart-1)" stroke-width="2.4"/>`;
s+=`<path d="M${rs.map(r=>X(r)+' '+Y(hit(r))).join('L')}" fill="none" stroke="var(--warning)" stroke-width="2.2" stroke-dasharray="6 3"/>`;
const r=2.5,z=fz(r),hz=hit(r);
s+=`<line class="ax" stroke-dasharray="2 3" x1="${X(r)}" y1="${T}" x2="${X(r)}" y2="${Y(0)}"/>`;
s+=`<circle cx="${X(r)}" cy="${Y(z)}" r="4" fill="var(--chart-1)"/><text class="k" x="${X(r)+7}" y="${Y(z)+14}">${z.toFixed(3).replace('.',',')}</text>`;
s+=`<circle cx="${X(r)}" cy="${Y(hz)}" r="4" fill="var(--warning)"/><text class="k" x="${X(r)+7}" y="${Y(hz)+14}">${hz.toFixed(2).replace('.',',')}</text>`;
const el=document.getElementById('s');el.setAttribute('width',W);el.setAttribute('height',H);el.setAttribute('viewBox',`0 0 ${W} ${H}`);el.innerHTML=s;
const f=x=>x.toFixed(3).replace('.',',');
document.getElementById('side').innerHTML=`<div><i class="sw" style="background:var(--chart-1)"></i><b>конечный размер</b> z = R<sub>∞</sub>/N</div><div><i class="sw" style="background:var(--warning)"></i><b>порог иммунитета</b> 1 − 1/r<sub>0</sub></div><br>
При r<sub>0</sub> ≤ 1 обе кривые равны нулю: вспышки нет.<br><br>
<b>Район, r<sub>0</sub> = 2,5:</b> для остановки роста хватило бы ${Math.round(hz*100)}% переболевших, а переболеет ${Math.round(z*100)}%. Заливка — <b>перелёт</b> (overshoot) эпидемии за порог.<br><br>
z при r<sub>0</sub> = 1,5 / 2 / 3: ${[1.5,2,3].map(v=>f(fz(v))).join(' / ')}.`;
</script>
