<style>
.g{display:grid;grid-template-columns:auto 1fr;column-gap:28px;font-family:var(--font-sans);align-items:start}
svg text{font-family:var(--font-sans);font-size:11px;fill:var(--muted-foreground)}
svg text.k{fill:var(--foreground);font-weight:600}
svg text.t{font-size:13px;font-weight:600;fill:var(--foreground)}
.ax{stroke:var(--border)}
.mk{stroke:var(--warning);stroke-dasharray:4 3;stroke-width:1.4}
.side{font-size:13px;line-height:1.55;color:var(--muted-foreground);border-left:2px solid var(--border);padding-left:14px}
.side b{color:var(--foreground)}
.sw{display:inline-block;width:14px;height:3px;vertical-align:3px;margin-right:6px}
</style>
<div class="g"><svg id="s"></svg><div class="side" id="side"></div></div>
<script>
// SIR of the district: integrate with RK4, every number below is computed here
const N=2000,n=10,beta=0.05,gam=0.2,S0=1999,I0=1,T=70,Tend=200,h=0.01;
const F=([S,I,R])=>{const inf=n*beta*S*I/N;return[-inf,inf-gam*I,gam*I]};
let y=[S0,I0,0],tr=[[0,...y]];
for(let k=1;k<=Tend/h;k++){const a=F(y),b=F(y.map((v,i)=>v+h/2*a[i])),c=F(y.map((v,i)=>v+h/2*b[i])),d=F(y.map((v,i)=>v+h*c[i]));y=y.map((v,i)=>v+h/6*(a[i]+2*b[i]+2*c[i]+d[i]));tr.push([k*h,...y])}
const r0=n*beta*S0/(N*gam),rt=p=>r0*p[1]/S0;
let pk=tr.reduce((m,p)=>p[2]>m[2]?p:m);
const W=420,L=44,R=12,X=t=>L+(W-L-R)*t/T;
const H1=200,T1=22,B1=180,Y1=v=>B1-(B1-T1)*v/N;
const T2=226,B2=318,Y2=v=>B2-(B2-T2)*v/3;
const trP=tr.filter(p=>p[0]<=T+1e-9);
const path=(f,Y,c,w)=>`<path d="${trP.filter((_,i)=>i%10==0).map((p,i)=>(i?'L':'M')+X(p[0]).toFixed(1)+' '+Y(f(p)).toFixed(1)).join('')}" fill="none" stroke="${c}" stroke-width="${w}"/>`;
const fr=x=>x.toFixed(2).replace('.',',');
let s=`<text class="t" x="${L}" y="12">Число людей в группах</text>`;
s+=`<line class="ax" x1="${L}" y1="${B1}" x2="${W-R}" y2="${B1}"/><line class="ax" x1="${L}" y1="${T1}" x2="${L}" y2="${B1}"/>`;
[0,500,1000,1500,2000].forEach(v=>s+=`<text x="${L-5}" y="${Y1(v)+4}" text-anchor="end">${v}</text>`);
s+=path(p=>p[1],Y1,'var(--chart-2)',2.2)+path(p=>p[2],Y1,'var(--chart-1)',2.6)+path(p=>p[3],Y1,'var(--chart-3)',2.2);
s+=`<text class="t" x="${L}" y="${T2-8}">Репродуктивное число r<tspan baseline-shift="sub" font-size="9">t</tspan> = r<tspan baseline-shift="sub" font-size="9">0</tspan>·S/S<tspan baseline-shift="sub" font-size="9">0</tspan></text>`;
s+=`<line class="ax" x1="${L}" y1="${B2}" x2="${W-R}" y2="${B2}"/><line class="ax" x1="${L}" y1="${T2}" x2="${L}" y2="${B2}"/>`;
[0,1,2,3].forEach(v=>s+=`<text x="${L-5}" y="${Y2(v)+4}" text-anchor="end">${v}</text>`);
s+=`<line class="ax" stroke-dasharray="2 3" x1="${L}" y1="${Y2(1)}" x2="${W-R}" y2="${Y2(1)}"/>`;
s+=path(rt,Y2,'var(--chart-5)',2.2);
[0,10,20,30,40,50,60,70].forEach(v=>s+=`<text x="${X(v)}" y="${B2+15}" text-anchor="middle">${v}</text>`);
s+=`<text x="${W-R}" y="${B2+29}" text-anchor="end">дни</text>`;
const xp=X(pk[0]);
s+=`<line class="mk" x1="${xp}" y1="${T1}" x2="${xp}" y2="${B2}"/>`;
s+=`<circle cx="${xp}" cy="${Y1(pk[2])}" r="3.5" fill="var(--chart-1)"/><text class="k" x="${X(pk[0]-3)}" y="${Y1(560)}" text-anchor="end" style="fill:var(--chart-1)">пик I = ${Math.round(pk[2])}</text>`;
s+=`<circle cx="${xp}" cy="${Y2(1)}" r="3.5" fill="var(--chart-5)"/><text class="k" x="${xp+6}" y="${Y2(1)-6}">r<tspan baseline-shift="sub" font-size="9">t</tspan> = 1</text>`;
const e=tr[tr.length-1],e70=trP[trP.length-1];
s+=`<text class="k" x="${W-R-2}" y="${Y1(e70[3])-6}" text-anchor="end">R → ${Math.round(e[3])}</text><text class="k" x="${W-R-2}" y="${Y1(e70[1])-6}" text-anchor="end">S → ${Math.round(e[1])}</text>`;
const el=document.getElementById('s');el.setAttribute('width',W);el.setAttribute('height',B2+32);el.setAttribute('viewBox',`0 0 ${W} ${B2+32}`);el.innerHTML=s;
document.getElementById('side').innerHTML=`<div><i class="sw" style="background:var(--chart-2)"></i>S — восприимчивые</div><div><i class="sw" style="background:var(--chart-1)"></i>I — заразные</div><div><i class="sw" style="background:var(--chart-3)"></i>R — выбывшие</div><div><i class="sw" style="background:var(--chart-5)"></i>r<sub>t</sub></div><br>
<b>Старт:</b> S<sub>0</sub> = ${S0}, I<sub>0</sub> = ${I0}, r<sub>0</sub> = ${fr(r0)}.<br>
<b>Пик</b> на ${pk[0].toFixed(1).replace('.',',')}-й день: заразны ${Math.round(pk[2])} человек, восприимчивых осталось доля ${fr(pk[1]/N)} — ровно 1/r<sub>0</sub>, и в этот момент r<sub>t</sub> = 1.<br>
<b>Итог</b> (к ${T}-му дню почти достигнут): переболеют ${Math.round(e[3])}, не заразятся ${Math.round(e[1])}.`;
</script>
