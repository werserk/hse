<style>
.g{display:grid;grid-template-columns:auto 1fr;column-gap:28px;font-family:var(--font-sans);align-items:start}
svg text{font-family:var(--font-sans);font-size:11px;fill:var(--muted-foreground)}
svg text.k{fill:var(--foreground);font-weight:600}
.ax{stroke:var(--border)}
.side{font-size:13px;line-height:1.55;color:var(--muted-foreground);border-left:2px solid var(--border);padding-left:14px;max-width:270px}
.side b{color:var(--foreground)}
.sw{display:inline-block;width:18px;height:0;border-top:2.2px solid;vertical-align:3px;margin-right:6px}
</style>
<div class="g"><svg id="s"></svg><div class="side" id="side"></div></div>
<script>
const r0=(rho,k)=>k==0?Math.exp(rho):Math.pow(1+k*rho,1/k);
const KS=[{k:0,d:'',l:'k = 0 (интервал ровно G)'},{k:0.25,d:'8 3',l:'k = 1/4'},{k:0.5,d:'4 3',l:'k = 1/2'},{k:1,d:'1 3',l:'k = 1 (показательный, SIR)'}];
const W=380,H=260,L=36,R=12,T=10,B=30,X=x=>L+(W-L-R)*x/3,ym=10,Y=v=>T+(H-T-B)*(1-(v-1)/(ym-1));
let s=`<defs><clipPath id="c"><rect x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}"/></clipPath></defs><line class="ax" x1="${L}" y1="${Y(1)}" x2="${W-R}" y2="${Y(1)}"/><line class="ax" x1="${L}" y1="${T}" x2="${L}" y2="${Y(1)}"/>`;
[1,2,4,6,8,10].forEach(v=>s+=`<text x="${L-5}" y="${Y(v)+4}" text-anchor="end">${v}</text>`);
[0,0.5,1,1.5,2,2.5,3].forEach(v=>s+=`<text x="${X(v)}" y="${Y(1)+15}" text-anchor="middle">${String(v).replace('.',',')}</text>`);
s+=`<text x="${W-R}" y="${H-2}" text-anchor="end">ρ = G/C</text>`;
s+='<g clip-path="url(#c)">'+KS.map(({k,d})=>{let p='';for(let i=0;i<=300;i++){const x=3*i/300;p+=(i?'L':'M')+X(x).toFixed(1)+' '+Y(r0(x,k)).toFixed(1)}return `<path d="${p}" fill="none" stroke="var(--chart-5)" stroke-width="2.2" stroke-dasharray="${d}"/>`}).join('')+'</g>';
const fr=(x,d)=>x.toFixed(d).replace('.',',');
const kc=1/2.6,rhoI=6.5*0.1475,pI=r0(rhoI,kc),rhoS=5*0.3,pS=r0(rhoS,1);
s+=`<circle cx="${X(rhoI)}" cy="${Y(pI)}" r="4.5" fill="var(--chart-1)"/><text class="k" x="${X(rhoI)-6}" y="${Y(pI)-9}" text-anchor="end">Италия ${fr(pI,2)}</text>`;
s+=`<circle cx="${X(rhoS)}" cy="${Y(pS)}" r="4.5" fill="var(--chart-2)"/><text class="k" x="${X(rhoS)+7}" y="${Y(pS)+16}">район ${fr(pS,1)}</text>`;
const el=document.getElementById('s');el.setAttribute('width',W);el.setAttribute('height',H);el.setAttribute('viewBox',`0 0 ${W} ${H}`);el.innerHTML=s;
document.getElementById('side').innerHTML=KS.map(({d,l})=>`<div><svg width="22" height="8"><line x1="0" y1="4" x2="22" y2="4" stroke="var(--chart-5)" stroke-width="2.2" stroke-dasharray="${d}"/></svg> ${l}</div>`).join('')+
`<br>Чем больше разброс интервала (k = CV²), тем меньше r<sub>0</sub> при том же росте. При малых ρ все кривые сливаются в 1 + ρ.<br><br>
<b style="color:var(--chart-1)">●</b> <b>Италия</b>, март 2020: рост 0,1475 в день, интервал со средним 6,5 и CV 0,62 (k = ${fr(kc,3)}): ρ = ${fr(rhoI,2)}.<br>
<b style="color:var(--chart-2)">●</b> <b>Район</b> (SIR): рост 0,3 в день, G = 1/γ = 5, k = 1: ρ = ${fr(rhoS,1)}.`;
</script>
